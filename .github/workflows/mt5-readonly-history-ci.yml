name: MT5 Read-only History Contract CI

on:
  pull_request:
    paths:
      - "integrations/mt5-readonly-bridge/**"
      - "integrations/mt5-readonly-proxy/**"
      - "integrations/mt5-bridge-relay/**"
      - "integrations/system-hub/**"
      - ".github/workflows/mt5-readonly-history-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mt5-history-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-bridge-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile read-only bridge
        run: python -m py_compile integrations/mt5-readonly-bridge/bridge.py integrations/mt5-readonly-bridge/bridge_relay_client.py
      - name: Run bridge tenant and history contracts
        run: python -m unittest discover -s integrations/mt5-readonly-bridge -p "test_*.py" -v

  worker-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check all affected Workers
        run: |
          node --check integrations/mt5-readonly-proxy/worker.js
          node --check integrations/mt5-bridge-relay/worker.js
          node --check integrations/system-hub/worker.js
      - name: Run proxy, relay and System Hub tests
        run: |
          node --test integrations/mt5-readonly-proxy/worker.test.mjs
          node --test integrations/mt5-bridge-relay/worker.test.mjs
          node --test integrations/system-hub/tests/*.test.mjs
