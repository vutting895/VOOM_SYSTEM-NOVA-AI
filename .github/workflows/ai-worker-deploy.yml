name: Deploy authenticated NOVA AI Worker

on:
  push:
    branches: [main]
    paths:
      - "integrations/nova-ai-worker/**"
      - ".github/workflows/ai-worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: nova-ai-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate deployment configuration without printing values
        shell: bash
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Deployment blocked. Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          echo "Required configuration is present."
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test AI Worker security contract
        working-directory: integrations/nova-ai-worker
        run: node --test
      - name: Deploy authenticated AI Worker
        working-directory: integrations/nova-ai-worker
        shell: bash
        run: |
          npx --yes wrangler deploy --config wrangler.toml --keep-vars \
            --var "SUPABASE_URL:$SUPABASE_URL" \
            --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY"

      - name: Smoke-test live AI Worker security gates without credentials
        shell: bash
        run: |
          set -euo pipefail
          base="https://voom-system-nova-ai.suwapat787.workers.dev"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$base/health")"
          if [ "$code" != "200" ] || ! grep -q '"executionEnabled":false' "$body" || ! grep -q '"liveTradingEnabled":false' "$body"; then
            echo "AI Worker health/safety smoke test failed (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' -X POST "$base/api/gen-ai/generate" -H 'Content-Type: application/json' --data '{"prompt":"unauthenticated security smoke test"}')"
          if [ "$code" != "401" ] || ! grep -q '"error":"authentication_required"' "$body"; then
            echo "AI Worker did not reject unauthenticated generation (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' -X POST "$base/api/backtest" -H 'Content-Type: application/json' --data '{"symbol":"XAUUSD"}')"
          if [ "$code" != "401" ] || ! grep -q '"error":"authentication_required"' "$body"; then
            echo "AI Worker did not reject unauthenticated backtest (HTTP $code)."
            exit 1
          fi
          echo "Live AI health is OK; unauthenticated generation/backtest are rejected; execution remains disabled."
