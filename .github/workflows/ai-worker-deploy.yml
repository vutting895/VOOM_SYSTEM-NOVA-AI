name: Deploy authenticated NOVA AI Worker

on:
  push:
    branches: [main]
    paths:
      - "integrations/nova-ai-worker/**"
      - ".github/workflows/ai-worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: nova-ai-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate deployment configuration without printing values
        shell: bash
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Deployment blocked. Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          echo "Required configuration is present."
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test AI Worker security contract
        working-directory: integrations/nova-ai-worker
        run: node --test
      - name: Deploy authenticated AI Worker
        working-directory: integrations/nova-ai-worker
        shell: bash
        run: |
          npx --yes wrangler deploy --config wrangler.toml --keep-vars \
            --var "SUPABASE_URL:$SUPABASE_URL" \
            --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY"
