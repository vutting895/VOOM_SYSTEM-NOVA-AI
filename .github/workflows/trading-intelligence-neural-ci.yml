name: Trading Intelligence Neural Runtime CI

on:
  pull_request:
    paths:
      - "workers/trading_intelligence/**"
      - ".github/workflows/trading-intelligence-neural-ci.yml"
  push:
    branches: [main]
    paths:
      - "workers/trading_intelligence/**"
      - ".github/workflows/trading-intelligence-neural-ci.yml"

permissions:
  contents: read

jobs:
  neural-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NumPy
        run: python -m pip install numpy==2.1.3
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Neural Runtime
        run: python -m py_compile workers/trading_intelligence/neural_runtime.py
      - name: Test Neural Runtime
        run: python -m unittest discover -s workers/trading_intelligence -p 'test_*.py' -v
