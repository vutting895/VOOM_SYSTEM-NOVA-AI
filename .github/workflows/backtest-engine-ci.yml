name: Deterministic Backtest Engine CI

on:
  pull_request:
    paths:
      - "workers/backtest/**"
      - "workers/tuning/**"
      - "workers/quant_engine/**"
      - "tests/test_workers.py"
      - "tests/test_dataset_registry.py"
      - "tests/test_ema_walk_forward.py"
      - ".github/workflows/backtest-engine-ci.yml"
  push:
    branches: [main]
    paths:
      - "workers/backtest/**"
      - "workers/tuning/**"
      - "workers/quant_engine/**"
      - "tests/test_workers.py"
      - "tests/test_dataset_registry.py"
      - "tests/test_ema_walk_forward.py"
      - ".github/workflows/backtest-engine-ci.yml"

permissions:
  contents: read

jobs:
  deterministic-research-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install fastapi pydantic httpx
      - name: Compile promoted engines
        run: python -m py_compile workers/backtest/engine.py workers/tuning/engine.py workers/quant_engine/quality.py workers/quant_engine/dataset_registry.py
      - name: Run backtest and tuning regressions
        run: python -m unittest discover -s tests -p "test_workers.py" -v
      - name: Run immutable dataset registry contract tests
        run: python -m unittest discover -s tests -p "test_dataset_registry.py" -v
      - name: Run leakage-safe EMA walk-forward tests
        run: python -m unittest discover -s tests -p "test_ema_walk_forward.py" -v
