name: NOVA System Hub Contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - "integrations/system-hub/**"
      - ".github/workflows/system-hub-ci.yml"
  push:
    branches: [main]
    paths:
      - "integrations/system-hub/**"
      - ".github/workflows/system-hub-ci.yml"

permissions:
  contents: read

concurrency:
  group: nova-system-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-hub-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run System Hub unit and contract tests
        working-directory: integrations/system-hub
        run: node --test tests/*.test.mjs
      - name: Validate Worker and contract module syntax
        working-directory: integrations/system-hub
        run: |
          node --check worker.js
          node --check gateway-contract.js
      - name: Validate Wrangler configuration JSON
        run: node -e "JSON.parse(require('fs').readFileSync('integrations/system-hub/wrangler.jsonc','utf8'))"
