name: NOVA Command Center CI

concurrency:
  group: nova-command-center-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "apps/nova-command-center/**"
      - ".github/workflows/nova-command-center-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Install, typecheck, lint changed files, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nova-command-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nova-command-center/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: ESLint changed TypeScript and JavaScript files
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          mapfile -t files < <(git diff --name-only "origin/$BASE_REF...HEAD" -- apps/nova-command-center/ | grep -E '\.(js|jsx|ts|tsx)$' | sed 's#^apps/nova-command-center/##')
          if ((${#files[@]})); then
            npx eslint "${files[@]}"
          else
            echo "No changed JavaScript/TypeScript files to lint."
          fi

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
