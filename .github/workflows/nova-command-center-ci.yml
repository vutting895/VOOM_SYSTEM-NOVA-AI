name: NOVA Command Center CI

concurrency:
  group: nova-command-center-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "apps/nova-command-center/**"
      - ".github/workflows/nova-command-center-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Install, typecheck, lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nova-command-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Generate an app-local lockfile during CI until the first reviewed lockfile
      # is committed. This keeps the root NOVA application's dependency graph untouched.
      - name: Resolve app dependencies and generate temporary lockfile
        run: bun install --lockfile-only

      - name: Install from resolved lockfile
        run: bun install --frozen-lockfile

      - name: TypeScript
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/tsc-diagnostics.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *"error TS"*)
                  escaped=${line//'%'/'%25'}
                  echo "::error title=TypeScript::${escaped}"
                  ;;
              esac
            done < "$RUNNER_TEMP/tsc-diagnostics.log"
          fi
          exit "$status"

      - name: ESLint
        shell: bash
        run: |
          set +e
          bun run lint --format json > "$RUNNER_TEMP/eslint-results.json"
          status=$?
          node <<'NODE'
          const fs = require("node:fs");
          const results = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/eslint-results.json", "utf8"));
          for (const result of results) {
            const file = result.filePath.replace(process.cwd() + "/", "");
            for (const issue of result.messages) {
              const message = `${issue.ruleId || "eslint"}: ${issue.message}`;
              const escaped = message.replace(/%/g, "%25").replace(/\\r/g, "%0D").replace(/\\n/g, "%0A");
              console.log(`::error file=${file},line=${issue.line || 1},col=${issue.column || 1},title=ESLint::${escaped}`);
            }
          }
          NODE
          exit "$status"

      - name: Upload ESLint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-command-center-eslint-diagnostics
          path: ${{ runner.temp }}/eslint-results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Unit tests
        if: always()
        run: bun run test

      - name: Production build
        if: always()
        run: bun run build

      - name: Upload app-local lockfile for review
        if: always() && hashFiles('apps/nova-command-center/bun.lock') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nova-command-center-bun-lock
          path: apps/nova-command-center/bun.lock
          if-no-files-found: ignore
          retention-days: 7
