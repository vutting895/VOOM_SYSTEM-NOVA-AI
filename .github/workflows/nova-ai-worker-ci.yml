name: NOVA AI Worker PR CI

on:
  pull_request:
    paths:
      - "integrations/nova-ai-worker/**"
      - ".github/workflows/nova-ai-worker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-ai-worker-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run authenticated Worker and rate-limit contract tests
        working-directory: integrations/nova-ai-worker
        run: node --test
      - name: Validate Wrangler configuration without deploying
        working-directory: integrations/nova-ai-worker
        run: npx --yes wrangler@4.156.0 deploy --dry-run --config wrangler.toml
