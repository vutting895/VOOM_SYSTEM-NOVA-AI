name: NOVA Video Engine Core CI

on:
  pull_request:
    paths:
      - "integrations/nova-video-engine/**"
      - ".github/workflows/nova-video-engine-ci.yml"

permissions:
  contents: read

jobs:
  engine-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test NOVA-owned engine core
        run: node --test integrations/nova-video-engine/engine.test.mjs
      - name: Syntax-check engine modules
        run: |
          node --check integrations/nova-video-engine/engine.mjs
          node --check integrations/nova-video-engine/ffmpeg-renderer.mjs
          node --check integrations/nova-video-engine/provider-registry.mjs
          node --check integrations/nova-video-engine/script-intelligence.mjs
          node --check integrations/nova-video-engine/generative-video.mjs
          node --check integrations/nova-video-engine/director-intelligence.mjs
          node --check integrations/nova-video-engine/job-lifecycle.mjs
          node --check integrations/nova-video-engine/quality-control.mjs
          node --check integrations/nova-video-engine/pipeline-orchestrator.mjs
          node --check integrations/nova-video-engine/wan22-local-runtime.mjs
          node --check integrations/nova-video-engine/dataset-governance.mjs
