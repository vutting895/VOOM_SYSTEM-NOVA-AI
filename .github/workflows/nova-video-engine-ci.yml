name: NOVA Video Engine Core CI

on:
  pull_request:
    paths:
      - "integrations/nova-video-engine/**"
      - ".github/workflows/nova-video-engine-ci.yml"
  push:
    branches: [main]
    paths:
      - "integrations/nova-video-engine/**"
      - ".github/workflows/nova-video-engine-ci.yml"

permissions:
  contents: read

jobs:
  cpu-engine-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check engine module syntax
        run: |
          node --check integrations/nova-video-engine/src/video-director.mjs
          node --check integrations/nova-video-engine/src/workflow-planner.mjs
          node --check integrations/nova-video-engine/src/ffmpeg-plan.mjs
      - name: Run deterministic engine tests
        run: npm run test:video-engine
