name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "netlify.toml"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/cloudflare-deploy.yml"
      - ".github/workflows/ai-worker-deploy.yml"
      - "integrations/mt5-readonly-proxy/**"
      - "integrations/mt5-bridge-relay/**"
      - "integrations/mt5-readonly-bridge/**"
      - "integrations/remote-mcp-worker/**"
      - "integrations/nova-ai-worker/**"
      - "shared/nova-intent-envelope.schema.json"
      - "integrations/system-hub/**"
      - "supabase/migrations/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "netlify.toml"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/cloudflare-deploy.yml"
      - ".github/workflows/ai-worker-deploy.yml"
      - "integrations/mt5-readonly-proxy/**"
      - "integrations/mt5-bridge-relay/**"
      - "integrations/mt5-readonly-bridge/**"
      - "integrations/remote-mcp-worker/**"
      - "integrations/nova-ai-worker/**"
      - "shared/nova-intent-envelope.schema.json"
      - "integrations/system-hub/**"
      - "supabase/migrations/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-not-a-secret"
      NEXT_PUBLIC_SYSTEM_HUB_URL: "https://example.invalid"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAFlosj98ci8iYugG"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test Supabase Marketplace security migration contract
        working-directory: .
        run: node --test tests/supabase-marketplace-security-migration.test.mjs
      - name: Test AI API authentication precedes payload validation
        working-directory: .
        run: node --test tests/frontend-gen-ai-auth-order.test.mjs
      - name: Test bounded NOVA chat history
        working-directory: .
        run: node --test tests/chat-history.test.mjs
      - name: Test frontend build SHA metadata
        working-directory: .
        run: node --test tests/frontend-build-info.test.mjs
      - name: Test chat API authentication before body parsing
        working-directory: .
        run: node --test tests/chat-api-auth-order.test.mjs
      - name: Test NOVA AI Worker authentication and safety contract
        working-directory: .
        run: node --test integrations/nova-ai-worker/*.test.mjs
      - name: Test NOVA System Integration Hub authorization and tenant boundaries
        working-directory: .
        run: node --test integrations/system-hub/tests/*.test.mjs
      - name: Test Remote MCP Exness MT5 read-only tools
        working-directory: .
        run: node --test integrations/remote-mcp-worker/tests/*.test.mjs
      - name: Test tenant-isolated MT5 Bridge relay and proxy
        working-directory: .
        run: node --test integrations/mt5-bridge-relay/worker.test.mjs integrations/mt5-readonly-proxy/worker.test.mjs
      - name: Syntax-check MT5 Bridge and outbound relay client
        working-directory: .
        run: python -m py_compile integrations/mt5-readonly-bridge/bridge.py integrations/mt5-readonly-bridge/bridge_relay_client.py
      - name: Test MT5 tenant guard contract
        working-directory: .
        run: python -m unittest discover -s integrations/mt5-readonly-bridge -p "test_*.py"
      - name: Install Wrangler for Cloudflare backend config validation without changing lockfile
        run: npm install --no-save --package-lock=false wrangler
      - name: Validate tenant relay Durable Object configuration
        working-directory: frontend
        run: npx wrangler deploy --dry-run --config ../integrations/mt5-bridge-relay/wrangler.jsonc
      - name: Validate NOVA System Integration Hub Worker bundle
        working-directory: frontend
        run: npx wrangler deploy --dry-run --config ../integrations/system-hub/wrangler.jsonc
      - name: Type-check
        run: npm run typecheck
      - name: Build Next.js frontend for CI validation
        run: npm run build

  netlify-production-smoke-test:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify Netlify Production routes and exact source commit
        shell: bash
        env:
          NETLIFY_SITE_URL: https://voomsystem.netlify.app
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          root_body="$(mktemp)"
          login_body="$(mktemp)"
          broker_body="$(mktemp)"
          info_body="$(mktemp)"
          trap 'rm -f "$root_body" "$login_body" "$broker_body" "$info_body"' EXIT

          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected GitHub commit SHA is missing or malformed."
            exit 1
          fi

          accepted=false
          for attempt in $(seq 1 18); do
            routes_ok=true
            for spec in "/:$root_body" "/login:$login_body" "/settings/broker:$broker_body"; do
              route="${spec%%:*}"
              target="${spec#*:}"
              code="$(curl --silent --show-error --location --max-time 20 -o "$target" -w '%{http_code}' "$NETLIFY_SITE_URL$route" || true)"
              if [ "$code" != "200" ]; then
                routes_ok=false
                echo "Netlify route $route returned HTTP $code on attempt $attempt/18."
              fi
            done

            if [ "$routes_ok" = "true" ]; then
              info_code="$(curl --silent --show-error --location --max-time 20 -o "$info_body" -w '%{http_code}' "$NETLIFY_SITE_URL/build-info.json" || true)"
              if [ "$info_code" = "200" ]; then
                served_commit="$(node -e 'const fs=require("node:fs"); try { console.log(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).commit || ""); } catch { console.log(""); }' "$info_body")"
                if [ "$served_commit" = "$EXPECTED_COMMIT" ]; then
                  accepted=true
                  break
                fi
                echo "Netlify still serves commit '$served_commit'; expected '$EXPECTED_COMMIT' (attempt $attempt/18)."
              else
                echo "Netlify /build-info.json returned HTTP $info_code on attempt $attempt/18."
              fi
            fi
            sleep 10
          done

          if [ "$accepted" != "true" ]; then
            echo "Netlify Production did not serve the expected main commit $EXPECTED_COMMIT; cutover verification failed."
            exit 1
          fi

          if ! grep -q 'Exness Demo' "$broker_body" && ! grep -q 'Exness MT5' "$broker_body"; then
            echo "Netlify broker settings route did not render the expected Exness MT5 content."
            exit 1
          fi

          echo "Netlify Production routes returned HTTP 200 and build-info.json matched exact commit $EXPECTED_COMMIT."
