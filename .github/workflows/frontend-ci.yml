name: Frontend CI

concurrency:
  group: nova-frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/frontend-auth-contract.test.mjs"
      - "server.ts"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - ".env.example"
      - "README.md"
      - "netlify.toml"
      - ".github/workflows/frontend-ci.yml"
      - "integrations/nova-ai-worker/**"
      - "integrations/system-hub/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/frontend-auth-contract.test.mjs"
      - "server.ts"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - ".env.example"
      - "README.md"
      - "netlify.toml"
      - ".github/workflows/frontend-ci.yml"
      - "integrations/nova-ai-worker/**"
      - "integrations/system-hub/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root Vite app dependencies
        run: npm install --no-package-lock --include=dev

      - name: Test frontend session and bearer-token contract
        run: node --test tests/frontend-auth-contract.test.mjs

      - name: Test authenticated NOVA AI Worker
        run: node --test integrations/nova-ai-worker/*.test.mjs

      - name: Test authenticated System Hub and tenant boundaries
        run: node --test integrations/system-hub/tests/*.test.mjs

      - name: Build Vite frontend
        run: npm run build
