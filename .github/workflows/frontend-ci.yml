name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "netlify.toml"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/cloudflare-deploy.yml"
      - ".github/workflows/ai-worker-deploy.yml"
      - "integrations/mt5-readonly-proxy/**"
      - "integrations/mt5-bridge-relay/**"
      - "integrations/mt5-readonly-bridge/**"
      - "integrations/remote-mcp-worker/**"
      - "integrations/nova-ai-worker/**"
      - "shared/nova-intent-envelope.schema.json"
      - "integrations/system-hub/**"
      - "supabase/migrations/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "netlify.toml"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/cloudflare-deploy.yml"
      - ".github/workflows/ai-worker-deploy.yml"
      - "integrations/mt5-readonly-proxy/**"
      - "integrations/mt5-bridge-relay/**"
      - "integrations/mt5-readonly-bridge/**"
      - "integrations/remote-mcp-worker/**"
      - "integrations/nova-ai-worker/**"
      - "shared/nova-intent-envelope.schema.json"
      - "integrations/system-hub/**"
      - "supabase/migrations/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-not-a-secret"
      NEXT_PUBLIC_SYSTEM_HUB_URL: "https://example.invalid"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAFlosj98ci8iYugG"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test Supabase Marketplace security migration contract
        working-directory: .
        run: node --test tests/supabase-marketplace-security-migration.test.mjs
      - name: Test AI API authentication precedes payload validation
        working-directory: .
        run: node --test tests/frontend-gen-ai-auth-order.test.mjs
      - name: Test bounded NOVA chat history
        working-directory: .
        run: node --test tests/chat-history.test.mjs
      - name: Test customer Zero-Menu Command Center contracts
        working-directory: .
        run: node --test tests/customer-command-center.test.mjs
      - name: Test server-side chat secret redaction
        working-directory: .
        run: node --test tests/chat-secret-redaction.test.mjs
      - name: Test chat API authentication before body parsing
        working-directory: .
        run: node --test tests/chat-api-auth-order.test.mjs
      - name: Test NOVA durable approval lifecycle contracts
        working-directory: .
        run: node --test tests/nova-approval-*.test.mjs
      - name: Test NOVA AI Worker authentication and safety contract
        working-directory: .
        run: node --test integrations/nova-ai-worker/*.test.mjs
      - name: Test NOVA System Integration Hub authorization and tenant boundaries
        working-directory: .
        run: node --test integrations/system-hub/tests/*.test.mjs
      - name: Test Remote MCP Exness MT5 read-only tools
        working-directory: .
        run: node --test integrations/remote-mcp-worker/tests/*.test.mjs
      - name: Test tenant-isolated MT5 Bridge relay and proxy
        working-directory: .
        run: node --test integrations/mt5-bridge-relay/worker.test.mjs integrations/mt5-readonly-proxy/worker.test.mjs
      - name: Syntax-check MT5 Bridge and outbound relay client
        working-directory: .
        run: python -m py_compile integrations/mt5-readonly-bridge/bridge.py integrations/mt5-readonly-bridge/bridge_relay_client.py
      - name: Test MT5 tenant guard contract
        working-directory: .
        run: python -m unittest discover -s integrations/mt5-readonly-bridge -p "test_*.py"
      - name: Install Wrangler for Cloudflare backend config validation without changing lockfile
        run: npm install --no-save --package-lock=false wrangler@4.156.0
      - name: Validate tenant relay Durable Object configuration
        working-directory: frontend
        run: npx wrangler deploy --dry-run --config ../integrations/mt5-bridge-relay/wrangler.jsonc
      - name: Validate NOVA System Integration Hub Worker bundle
        working-directory: frontend
        run: npx wrangler deploy --dry-run --config ../integrations/system-hub/wrangler.jsonc
      - name: Type-check
        run: npm run typecheck
      - name: Build Next.js frontend for CI validation
        run: npm run build

      - name: Build Cloudflare OpenNext Worker bundle for CI validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-not-a-secret"
          NEXT_PUBLIC_SYSTEM_HUB_URL: "https://example.invalid"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "ci-placeholder-not-a-secret"
          NEXT_PUBLIC_NOVA_APPROVALS_ENABLED: "false"
        run: npm run cf:build



  cloudflare-pr-preview:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 85 && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOVA_STAGING_SUPABASE_URL: https://rovhmjeowracayicbqij.supabase.co
      NOVA_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NOVA_STAGING_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rovhmjeowracayicbqij.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NOVA_STAGING_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SYSTEM_HUB_URL: https://example.invalid
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_NOVA_APPROVALS_ENABLED: "true"
      NOVA_APPROVALS_ENABLED: "true"
    steps:
      - name: Checkout exact PR head SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Cloudflare and staging preview configuration without printing values
        shell: bash
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NOVA_STAGING_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_TURNSTILE_SITE_KEY; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Exact-SHA Cloudflare preview blocked. Configure GitHub Actions secrets/variables (names only): ${missing[*]}"
            exit 1
          fi
          echo "Cloudflare preview configuration is present."
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Next.js for isolated staging Cloudflare preview
        working-directory: frontend
        run: npm run cf:build
      - name: Deploy exact PR SHA to isolated staging Cloudflare Worker
        working-directory: frontend
        run: |
          npx wrangler deploy --config wrangler.jsonc --name voom-system-nova-ui-pr85-preview \
            --var "SUPABASE_URL:$NOVA_STAGING_SUPABASE_URL" \
            --var "SUPABASE_PUBLISHABLE_KEY:$NOVA_STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --var "SUPABASE_ANON_KEY:$NOVA_STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --var "NOVA_APPROVALS_ENABLED:true" \
            --var "NOVA_AI_API_URL:https://example.invalid" \
            --var "MT5_READONLY_PROXY_URL:https://example.invalid"
      - name: Smoke-test exact-SHA Cloudflare staging preview
        shell: bash
        run: |
          set -euo pipefail
          ui="https://voom-system-nova-ui-pr85-preview.suwapat787.workers.dev"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          for path in / /login /command-center /settings/broker; do
            code="$(curl --silent --show-error --location --max-time 25 -o "$body" -w '%{http_code}' "$ui$path" || true)"
            if [ "$code" != "200" ]; then
              echo "Cloudflare staging preview route $path failed with HTTP $code."
              exit 1
            fi
          done
          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{invalid-json' "$ui/api/chat" || true)"
          if [ "$code" != "401" ] || ! grep -q '"error":"authentication_required"' "$body"; then
            echo "Cloudflare staging preview chat API did not reject an unauthenticated request (HTTP $code)."
            exit 1
          fi
          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$ui/api/broker/status?broker=mt5" || true)"
          if [ "$code" != "401" ]; then
            echo "Cloudflare staging preview broker API did not reject an unauthenticated request (HTTP $code)."
            exit 1
          fi
          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$ui/api/agent/threads" || true)"
          if [ "$code" != "401" ]; then
            echo "Cloudflare staging preview approvals API did not reject an unauthenticated request (HTTP $code)."
            exit 1
          fi
          echo "Cloudflare exact-SHA staging preview routes and unauthenticated API denial checks passed."

  staging-customer-isolation:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 85 && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [build, cloudflare-pr-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOVA_STAGING_SUPABASE_URL: https://rovhmjeowracayicbqij.supabase.co
      NOVA_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NOVA_STAGING_SUPABASE_PUBLISHABLE_KEY }}
      NOVA_STAGING_APP_URL: https://voom-system-nova-ui-pr85-preview.suwapat787.workers.dev
    steps:
      - name: Checkout PR code for isolated staging verification
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run two-customer broker, thread and approval isolation tests
        working-directory: .
        env:
          NOVA_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NOVA_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node tests/staging-customer-isolation.mjs

  netlify-production-smoke-test:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify production Netlify routes after deployment propagation
        shell: bash
        env:
          NETLIFY_SITE_URL: https://voomsystem.netlify.app
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          for path in / /login /settings/broker; do
            healthy=false
            for attempt in $(seq 1 12); do
              code="$(curl --silent --show-error --location --max-time 20 -o "$body" -w '%{http_code}' "$NETLIFY_SITE_URL$path" || true)"
              if [ "$code" = "200" ]; then
                healthy=true
                break
              fi
              echo "Netlify route $path returned HTTP $code on attempt $attempt/12; retrying boundedly."
              sleep 10
            done
            if [ "$healthy" != "true" ]; then
              echo "Netlify production route $path did not return HTTP 200 after bounded retries."
              exit 1
            fi
          done
          if ! grep -q 'Exness Demo' "$body" && ! grep -q 'Exness MT5' "$body"; then
            echo "Netlify broker settings route did not render the expected Exness MT5 content."
            exit 1
          fi
          echo "Netlify root, login, and Exness broker settings routes returned HTTP 200."
