name: Kaggle API Read-only Connection Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-api-readonly-check
  cancel-in-progress: false

jobs:
  kaggle-auth-check:
    name: Verify Kaggle API credentials without exposing them
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --disable-pip-version-check kaggle

      - name: Verify credentials and make a read-only API request
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        shell: bash
        run: |
          set +x
          python - <<'PY'
          import csv
          import io
          import os
          import subprocess
          import sys

          required = ("KAGGLE_USERNAME", "KAGGLE_KEY")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("Kaggle authentication check blocked: required GitHub Actions secret(s) are missing.")
              sys.exit(2)

          try:
              result = subprocess.run(
                  ["kaggle", "datasets", "list", "--page", "1", "--csv"],
                  capture_output=True,
                  text=True,
                  timeout=90,
                  check=False,
              )
          except subprocess.TimeoutExpired:
              print("Kaggle API check failed: request timed out.")
              sys.exit(1)
          except OSError:
              print("Kaggle API check failed: Kaggle CLI could not be started.")
              sys.exit(1)

          if result.returncode != 0:
              # Suppress CLI output because third-party error text must never reach Actions logs.
              print("Kaggle API authentication/request failed. CLI details were suppressed to protect credentials.")
              sys.exit(1)

          try:
              rows = list(csv.reader(io.StringIO(result.stdout)))
          except csv.Error:
              print("Kaggle API responded, but the dataset-list response could not be parsed.")
              sys.exit(1)

          if len(rows) < 2:
              print("Kaggle API request completed, but no dataset rows were returned.")
              sys.exit(1)

          print(f"Kaggle API authentication successful; read-only dataset listing returned {len(rows) - 1} row(s).")
          PY
