name: Backtest Research CI

on:
  pull_request:
    paths:
      - "workers/backtest/**"
      - "tests/test_strategy_backtest.py"
      - ".github/workflows/backtest-research-ci.yml"
  push:
    branches: [main]
    paths:
      - "workers/backtest/**"
      - "tests/test_strategy_backtest.py"
      - ".github/workflows/backtest-research-ci.yml"

permissions:
  contents: read

jobs:
  strategy-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backtest engines
        run: |
          python -m py_compile workers/backtest/engine_prototype.py
          python -m py_compile workers/backtest/strategy_engine.py
      - name: Run strategy engine regression tests
        run: python -m unittest discover -s tests -p "test_strategy_backtest.py" -v
