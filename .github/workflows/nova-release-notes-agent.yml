name: NOVA Release Notes Evidence Pack

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # Every Monday at 02:00 UTC

permissions:
  contents: read

concurrency:
  group: nova-release-notes-evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate collector syntax
        run: python3 -m py_compile scripts/release_notes/generate_evidence.py
      - name: Collect commit evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python3 scripts/release_notes/generate_evidence.py
      - name: Upload review pack
        uses: actions/upload-artifact@v4
        with:
          name: nova-release-notes-evidence-${{ github.run_number }}
          path: |
            release-notes-evidence.md
            release-notes-evidence.json
          if-no-files-found: error
          retention-days: 30
