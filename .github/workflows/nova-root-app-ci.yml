name: NOVA Root App CI

on:
  pull_request:
    paths:
      - ".env.example"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "src/**"
      - "server.ts"
      - "netlify.toml"
      - "public/**"
      - "integrations/system-hub/**"
      - "docs/NOVA-INTEGRATION-CENTER-FULL-AUTOMATION.md"
  push:
    branches: [main]
    paths:
      - ".env.example"
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "server.ts"
      - "netlify.toml"
      - "public/**"
      - "integrations/system-hub/**"
      - "docs/NOVA-INTEGRATION-CENTER-FULL-AUTOMATION.md"

permissions:
  contents: read

jobs:
  build-and-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --no-save
      - name: Run Integration Center contract tests
        run: node --test src/IntegrationCenterPage.contract.test.mjs
      - name: Run System Hub authorization and CORS tests
        run: node --test integrations/system-hub/tests/system-hub.test.mjs
      - name: Install Wrangler for System Hub build validation
        run: npm install --no-save --package-lock=false wrangler@4.156.0
      - name: Validate System Hub Worker bundle
        run: npx wrangler deploy --dry-run --config integrations/system-hub/wrangler.jsonc
      - name: Build NOVA Vite application
        run: bun run build
