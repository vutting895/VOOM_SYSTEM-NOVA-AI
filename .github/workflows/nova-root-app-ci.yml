name: NOVA Root App CI

on:
  pull_request:
    paths:
      - ".env.example"
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "docs/NOVA-INTEGRATION-CENTER-FULL-AUTOMATION.md"
  push:
    branches: [main]
    paths:
      - ".env.example"
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "docs/NOVA-INTEGRATION-CENTER-FULL-AUTOMATION.md"

permissions:
  contents: read

jobs:
  build-and-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --no-save
      - name: Run Integration Center contract tests
        run: node --test src/IntegrationCenterPage.contract.test.mjs
      - name: Build NOVA Vite application
        run: bun run build
