name: NOVA Hybrid Notebook Validation

on:
  pull_request:
    paths:
      - "notebooks/NOVA_Hybrid_Continuous_MultiAsset_Training.ipynb"
      - "tests/test_nova_hybrid_notebook.py"
      - "docs/NOVA-HYBRID-CONTINUOUS-NOTEBOOK.md"
      - ".github/workflows/nova-hybrid-notebook-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook validation dependencies
        run: python -m pip install --disable-pip-version-check nbformat numpy pandas
      - name: Validate notebook structure and safety contract
        run: |
          python -m nbformat.validate notebooks/NOVA_Hybrid_Continuous_MultiAsset_Training.ipynb
          python -m unittest discover -s tests -p "test_nova_hybrid_notebook.py" -v
