name: NOVA PostgreSQL Reservation Concurrency

on:
  pull_request:
    paths:
      - "supabase/migrations/202611120002_nova_atomic_account_capacity.sql"
      - "tests/postgres/nova-capacity-concurrency.test.mjs"
      - ".github/workflows/nova-postgres-reservation-ci.yml"

permissions:
  contents: read

jobs:
  postgres-reservation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NOVA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nova_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL client driver without modifying lockfiles
        run: npm install --no-save --package-lock=false pg@8
      - name: Run real multi-session reservation tests
        run: node tests/postgres/nova-capacity-concurrency.test.mjs
