name: NOVA Notebook Validation

on:
  pull_request:
    paths:
      - "notebooks/**"
      - "tests/test_nova_notebook.py"
      - ".github/workflows/nova-notebook-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Validate notebook JSON, Python syntax, and synthetic OHLCV cases
        run: python -m unittest discover -s tests -p "test_nova_notebook.py" -v
