name: NOVA Exporter and Ingestion CI

on:
  push:
    branches:
      - feature/nova-v183-export-api-clean-20261126-r2
    paths:
      - "workers/data-ingestion/**"
      - "integrations/mt5/ea-research/v1.83/brain-contract/**"
      - ".github/workflows/nova-export-ingestion-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "workers/data-ingestion/**"
      - "integrations/mt5/ea-research/v1.83/brain-contract/**"
      - ".github/workflows/nova-export-ingestion-ci.yml"

permissions:
  contents: read

concurrency:
  group: nova-export-ingestion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingestion-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated ingestion Worker tests
        working-directory: workers/data-ingestion
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --test

  host-uploader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.20,<5"
      - name: Compile uploader and run unit tests
        run: |
          python -m py_compile integrations/mt5/ea-research/v1.83/brain-contract/uploader.py
          python -m unittest discover -s integrations/mt5/ea-research/v1.83/brain-contract -p "test_*.py" -v

  safety-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert ingestion Worker has no broker/order transport integration
        run: |
          ! grep -En "OrderSend|CTrade|WebRequest|/api/orders|/v1/orders" workers/data-ingestion/src/index.js
          grep -q 'ordersEnabled: false' workers/data-ingestion/src/index.js
          grep -q 'executionEnabled: false' workers/data-ingestion/src/index.js
          grep -q 'liveTradingEnabled: false' workers/data-ingestion/src/index.js
