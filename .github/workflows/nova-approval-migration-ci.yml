name: NOVA Approval Migration CI

on:
  pull_request:
    paths:
      - "supabase/migrations/20261031070311_nova_durable_approval_lifecycle.sql"
      - "supabase/migrations/20261027160402_mt5_customer_connections.sql"
      - "supabase/pending-migrations/202611070001_nova_approval_audit_event_log.sql"
      - "tests/sql/nova-approval-migration.integration.sql"
      - "tests/sql/nova-approval-audit-events.integration.sql"
      - "tests/nova-approval-migration.test.mjs"
      - "tests/nova-approval-audit-events.test.mjs"
      - "tests/nova-approval-api.test.mjs"
      - "tests/nova-approval-contract.test.mjs"
      - "tests/nova-approval-checkpoint.test.mjs"
      - "frontend/scripts/nova-approval-local-supabase.integration.mjs"
      - "src/server/**"
      - "server.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/nova-approval-migration-ci.yml"
  push:
    branches:
      - main
      - feat/nova-approval-api-audit-stack-20261107
    paths:
      - "supabase/migrations/20261031070311_nova_durable_approval_lifecycle.sql"
      - "supabase/migrations/20261027160402_mt5_customer_connections.sql"
      - "supabase/pending-migrations/202611070001_nova_approval_audit_event_log.sql"
      - "tests/sql/nova-approval-migration.integration.sql"
      - "tests/sql/nova-approval-audit-events.integration.sql"
      - "tests/nova-approval-migration.test.mjs"
      - "tests/nova-approval-audit-events.test.mjs"
      - "tests/nova-approval-api.test.mjs"
      - "tests/nova-approval-contract.test.mjs"
      - "tests/nova-approval-checkpoint.test.mjs"
      - "frontend/scripts/nova-approval-local-supabase.integration.mjs"
      - "src/server/**"
      - "server.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/nova-approval-migration-ci.yml"

permissions:
  contents: read

jobs:
  postgres-migration-and-owner-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nova-ci-only-password
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize isolated PostgreSQL test roles and Supabase Auth stub
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          test -n "$pg_container"
          docker exec -i "$pg_container" psql -U postgres -d nova_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $function$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          SQL

      - name: Apply the owner-scoped approval lifecycle and append-only audit candidate
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker cp supabase/migrations/20261031070311_nova_durable_approval_lifecycle.sql "$pg_container:/tmp/nova-approval-migration.sql"
          docker cp supabase/pending-migrations/202611070001_nova_approval_audit_event_log.sql "$pg_container:/tmp/nova-approval-audit.sql"
          docker exec "$pg_container" psql -U postgres -d nova_test -v ON_ERROR_STOP=1 -f /tmp/nova-approval-migration.sql
          docker exec "$pg_container" psql -U postgres -d nova_test -v ON_ERROR_STOP=1 -f /tmp/nova-approval-audit.sql

      - name: Verify owner isolation, decisions and append-only audit events in PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker cp tests/sql/nova-approval-migration.integration.sql "$pg_container:/tmp/nova-approval-integration.sql"
          docker cp tests/sql/nova-approval-audit-events.integration.sql "$pg_container:/tmp/nova-approval-audit-integration.sql"
          docker exec "$pg_container" psql -X -U postgres -d nova_test -v ON_ERROR_STOP=1 -f /tmp/nova-approval-integration.sql
          docker exec "$pg_container" psql -X -U postgres -d nova_test -v ON_ERROR_STOP=1 -f /tmp/nova-approval-audit-integration.sql

      - name: Run Approval and Audit source contract tests
        run: >-
          node --test
          tests/nova-approval-migration.test.mjs
          tests/nova-approval-audit-events.test.mjs
          tests/nova-approval-api.test.mjs
          tests/nova-approval-contract.test.mjs
          tests/nova-approval-checkpoint.test.mjs

  local-supabase-auth-and-api:
    name: Local Supabase Auth, PostgREST and Express API A/B isolation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI v2
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.122.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install root Express application dependencies from the committed lockfile
        run: bun install --frozen-lockfile

      - name: Start an isolated local Supabase Auth and database stack
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d /tmp/nova-local-supabase.XXXXXX)"
          echo "NOVA_SUPABASE_WORKDIR=$workdir" >> "$GITHUB_ENV"
          mkdir -p "$workdir/supabase/migrations"

          # This throwaway local stack contains only the exact approval dependencies.
          # The full 25-file Production migration history is independently replayed by PR #233.
          cat > "$workdir/supabase/migrations/202610260000_nova_ci_extensions.sql" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
          SQL
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261027160402_mt5_customer_connections.sql" "$workdir/supabase/migrations/"
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261031070311_nova_durable_approval_lifecycle.sql" "$workdir/supabase/migrations/"
          cp "$GITHUB_WORKSPACE/supabase/pending-migrations/202611070001_nova_approval_audit_event_log.sql" "$workdir/supabase/migrations/"

          cd "$workdir"
          supabase init
          supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
          supabase status -o env > "$workdir/status.env"

          set -a
          # Generated local-only keys are used for disposable Auth fixtures.
          source "$workdir/status.env"
          set +a
          test -n "${API_URL:-}"
          test -n "${ANON_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"
          {
            printf 'NOVA_LOCAL_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NOVA_LOCAL_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'NOVA_LOCAL_SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Run the root Express Approval API with user-scoped Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL="$NOVA_LOCAL_SUPABASE_URL" \
          SUPABASE_ANON_KEY="$NOVA_LOCAL_SUPABASE_ANON_KEY" \
          NOVA_APPROVALS_ENABLED=true \
          NODE_ENV=development \
          PORT=3100 \
          bun run dev > /tmp/nova-approval-express.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 45); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/agent/threads || true)"
            if [ "$status" = "401" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/nova-approval-express.log
            echo "Root Express Approval API did not become ready"
            exit 1
          fi

          NOVA_LOCAL_APP_URL=http://127.0.0.1:3100 \
          node frontend/scripts/nova-approval-local-supabase.integration.mjs

      - name: Stop the disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -n "${NOVA_SUPABASE_WORKDIR:-}" ] && [ -d "$NOVA_SUPABASE_WORKDIR" ]; then
            cd "$NOVA_SUPABASE_WORKDIR"
            supabase stop --no-backup || true
          fi
