name: NOVA Learning Orchestrator CI

on:
  pull_request:
    paths:
      - "integrations/nova-ai-mcp-full-clean/workers/**"
      - "integrations/nova-ai-mcp-full-clean/tests/**"
      - "integrations/nova-ai-mcp-full-clean/docs/LEARNING-ORCHESTRATOR.md"
      - ".github/workflows/nova-learning-orchestrator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-learning-orchestrator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/nova-ai-mcp-full-clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas xgboost
      - name: Run learning contract tests
        run: python -m unittest discover -s tests -v
