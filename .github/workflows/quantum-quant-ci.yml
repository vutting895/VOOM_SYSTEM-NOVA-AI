name: Quantum Quant Engine CI

on:
  pull_request:
    paths:
      - "workers/quantum/**"
      - "tests/test_quantum_quant_engine.py"
      - ".github/workflows/quantum-quant-ci.yml"
  push:
    branches: [main]
    paths:
      - "workers/quantum/**"
      - "tests/test_quantum_quant_engine.py"
      - ".github/workflows/quantum-quant-ci.yml"

permissions:
  contents: read

jobs:
  quantum-quant-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quantum research dependencies
        run: python -m pip install --disable-pip-version-check -r workers/quantum/requirements.txt
      - name: Compile engine
        run: python -m py_compile workers/quantum/quant_engine.py
      - name: Run focused tests
        run: python -m unittest discover -s tests -p "test_quantum_quant_engine.py" -v
