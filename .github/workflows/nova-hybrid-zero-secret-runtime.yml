name: NOVA Hybrid-Zero Secret Runtime CI

on:
  pull_request:
    paths:
      - "docs/architecture/NOVA-HYBRID-ZERO-SECRET-RUNTIME.md"
      - "tools/security/nova-hybrid-zero-secret-runtime.test.mjs"
  push:
    branches: [main]
    paths:
      - "docs/architecture/NOVA-HYBRID-ZERO-SECRET-RUNTIME.md"
      - "tools/security/nova-hybrid-zero-secret-runtime.test.mjs"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run secret boundary contract tests
        run: node --test tools/security/nova-hybrid-zero-secret-runtime.test.mjs
