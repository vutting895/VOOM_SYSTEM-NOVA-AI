name: SMC and Wave3 Research CI

on:
  pull_request:
    paths:
      - "workers/feature/smc_wave/**"
      - "workers/strategy/**"
      - "tests/test_smc_strategy.py"
      - "tests/test_wave3_ml_pipeline.py"
      - "tests/test_wave3_calendar_hash.py"
      - "tests/test_wave3_news_calendar_validation.py"
      - "datasets/exness-demo/news/**"
      - "tools/train_wave3_models.py"
      - "tools/verify_wave3_news_calendar.py"
      - "tools/validate_wave3_news_calendar.py"
      - "tools/audit_wave3_smc_candidates.py"
      - "requirements-wave3.txt"
      - "integrations/remote-mcp-worker/src/index.js"
      - "integrations/remote-mcp-worker/tests/**"
      - "integrations/remote-mcp-worker/package.json"
      - "README.md"
      - "docs/WAVE3_MODEL_TRAINING_PLAN.md"
      - "docs/WAVE3_SMC_GATE_AND_NEWS_CALENDAR.md"
      - "reports/wave3_smc_gate_diagnostic_*.json"
      - "reports/wave3_smc_candidate_trace_*.json"
      - ".github/workflows/smc-research-ci.yml"
  push:
    branches: [main]
    paths:
      - "workers/feature/smc_wave/**"
      - "workers/strategy/**"
      - "tests/test_smc_strategy.py"
      - "tests/test_wave3_ml_pipeline.py"
      - "README.md"
      - "docs/WAVE3_MODEL_TRAINING_PLAN.md"
      - "docs/WAVE3_SMC_GATE_AND_NEWS_CALENDAR.md"
      - "reports/wave3_smc_gate_diagnostic_*.json"
      - "reports/wave3_smc_candidate_trace_*.json"
      - "tests/test_wave3_calendar_hash.py"
      - "tests/test_wave3_news_calendar_validation.py"
      - "datasets/exness-demo/news/**"
      - "tools/train_wave3_models.py"
      - "tools/verify_wave3_news_calendar.py"
      - "requirements-wave3.txt"
      - "integrations/remote-mcp-worker/src/index.js"
      - "integrations/remote-mcp-worker/tests/**"
      - "integrations/remote-mcp-worker/package.json"
      - ".github/workflows/smc-research-ci.yml"

permissions:
  contents: read

jobs:
  smc-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
      - name: Install Wave3 research dependencies
        run: python -m pip install -r requirements-wave3.txt
      - name: Compile SMC and Wave3 research modules
        run: python -m py_compile workers/feature/smc_wave/smc_strategy.py workers/strategy/wave3_ml_pipeline.py tools/train_wave3_models.py tools/verify_wave3_news_calendar.py tools/validate_wave3_news_calendar.py tools/audit_wave3_smc_candidates.py
      - name: Run focused SMC tests
        run: python -m unittest discover -s tests -p "test_smc_strategy.py" -v
      - name: Run Wave3 ML pipeline tests
        run: python -m unittest discover -s tests -p "test_wave3_ml_pipeline.py" -v
      - name: Run pinned news calendar SHA-256 tests
        run: python -m unittest discover -s tests -p "test_wave3_calendar_hash.py" -v
      - name: Run historical news calendar validation tests
        run: python -m unittest discover -s tests -p "test_wave3_news_calendar_validation.py" -v
      - name: Validate canonical historical news calendar
        run: python tools/validate_wave3_news_calendar.py datasets/exness-demo/news/VOOM_USD_High_Impact_2022_2026.csv
      - name: Run Cloudflare Worker SMC classification tests
        run: node --test integrations/remote-mcp-worker/tests/smc.test.mjs
      - name: Generate causal SMC candidate trace (diagnostic only; no model training)
        run: >-
          python tools/audit_wave3_smc_candidates.py
          --data datasets/exness-demo/XAUUSDm_M15_2022-2026.csv
          --calendar datasets/exness-demo/news/VOOM_USD_High_Impact_2022_2026.csv
          --output reports/wave3_smc_candidate_trace_20261101.json
      - name: Upload causal SMC candidate trace
        uses: actions/upload-artifact@v4
        with:
          name: wave3-smc-candidate-trace-${{ github.sha }}
          path: reports/wave3_smc_candidate_trace_20261101.json
          if-no-files-found: error
          retention-days: 30
