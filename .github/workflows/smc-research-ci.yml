name: SMC Research CI

on:
  pull_request:
    paths:
      - "workers/feature/smc_wave/**"
      - "workers/feature/elliott_wave/**"
      - "workers/backtest/**"
      - "tests/test_smc_strategy.py"
      - "tests/test_smc_pytest.py"
      - "tests/test_telegram_alerts.py"
      - "tests/test_runtime_api.py"
      - "tests/test_research_pipeline.py"
      - "tests/fixtures/btcusdt_1h_binance_sample.json"
      - "workers/alerts/**"
      - "workers/risk/**"
      - "workers/runtime.py"
      - "workers/requirements.txt"
      - "infra/docker-compose.yml"
      - "workers/Dockerfile"
      - "Dockerfile"
      - "package.json"
      - "server.ts"
      - "package-lock.json"
      - "integrations/remote-mcp-worker/src/index.js"
      - "integrations/remote-mcp-worker/tests/**"
      - "integrations/remote-mcp-worker/package.json"
      - ".github/workflows/smc-research-ci.yml"
  push:
    branches: [main]
    paths:
      - "workers/feature/smc_wave/**"
      - "tests/test_smc_strategy.py"
      - "tests/test_smc_pytest.py"
      - "tests/test_telegram_alerts.py"
      - "tests/test_runtime_api.py"
      - "workers/alerts/**"
      - "workers/risk/**"
      - "workers/runtime.py"
      - "workers/requirements.txt"
      - "infra/docker-compose.yml"
      - "workers/Dockerfile"
      - "Dockerfile"
      - "package.json"
      - "server.ts"
      - "package-lock.json"
      - "integrations/remote-mcp-worker/src/index.js"
      - "integrations/remote-mcp-worker/tests/**"
      - "integrations/remote-mcp-worker/package.json"
      - ".github/workflows/smc-research-ci.yml"

permissions:
  contents: read

jobs:
  smc-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install pytest fastapi pydantic httpx
      - name: Set up Node.js for MT5 Worker tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate MT5 Python adapter syntax
        run: python -m py_compile workers/quant/mt5_decision_adapter.py workers/risk/mt5_decision_gate.py
      - name: Run MT5 Python contract tests
        run: python -m unittest workers.tests.test_mt5_quant_adapter workers.tests.test_mt5_risk_gate workers.tests.test_mt5_decision_pipeline -v
      - name: Run MT5 Worker contract tests
        run: node --test integrations/nova-mt5-decision-api/*.test.mjs integrations/nova-quant-engine-adapter/*.test.mjs
      - name: Compile SMC research module
        run: python -m py_compile workers/feature/smc_wave/smc_strategy.py
      - name: Run focused SMC tests
        run: python -m unittest discover -s tests -p "test_smc_strategy.py" -v
      - name: Run pytest regression suite
        run: python -m pytest tests/test_smc_pytest.py tests/test_telegram_alerts.py tests/test_runtime_api.py tests/test_research_pipeline.py -q
      - name: Run Cloudflare Worker SMC classification tests
        run: node --test integrations/remote-mcp-worker/tests/smc.test.mjs
      - name: Validate Docker Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Build research worker container
        run: docker build -f workers/Dockerfile -t nova-research-worker:ci .
      - name: Build frontend container
        run: docker build -f Dockerfile -t nova-frontend:ci .
