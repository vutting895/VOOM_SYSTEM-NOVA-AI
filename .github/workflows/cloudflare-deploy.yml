name: Deploy VOOM Backend Workers to Cloudflare

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: voom-backend-workers-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact commit validated by Frontend CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify Cloudflare deployment configuration without printing values
        shell: bash
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Deployment blocked. Configure the required GitHub Actions secrets (names only): ${missing[*]}"
            exit 1
          fi
          echo "Required Cloudflare deployment configuration is present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wrangler without changing the lockfile
        working-directory: frontend
        run: npm install --no-save --package-lock=false wrangler

      # Stable workers.dev relay removes dependency on a custom domain or public Windows origin.
      - name: Deploy tenant-isolated MT5 Bridge relay
        working-directory: frontend
        run: npx wrangler deploy --config ../integrations/mt5-bridge-relay/wrangler.jsonc --keep-vars

      # Keep frontend hosting/deployment separate; this workflow deploys and verifies backend Workers only.
      - name: Deploy authenticated Exness MT5 read-only proxy
        working-directory: frontend
        run: npx wrangler deploy --config ../integrations/mt5-readonly-proxy/wrangler.jsonc --keep-vars

      - name: Deploy authenticated read-only Remote MCP Worker
        working-directory: frontend
        run: npx wrangler deploy --config ../integrations/remote-mcp-worker/wrangler.jsonc --keep-vars

      - name: Smoke-test Cloudflare backend worker safety contracts
        shell: bash
        run: |
          set -euo pipefail
          proxy="https://voom-mt5-readonly-proxy.suwapat787.workers.dev"
          relay="https://voom-mt5-bridge-relay.suwapat787.workers.dev"
          mcp="https://voom-system-mcp.suwapat787.workers.dev"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$relay/health" || true)"
          if [ "$code" != "200" ] || ! grep -q '"status":"relay_ready"' "$body" || ! grep -q '"ordersEnabled":false' "$body" || ! grep -q '"liveTradingEnabled":false' "$body"; then
            echo "MT5 relay health or read-only safety check failed (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$relay/api/account" || true)"
          if [ "$code" != "401" ] || ! grep -q '"authentication_required"' "$body"; then
            echo "MT5 relay did not reject unauthenticated account access (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$proxy/health" || true)"
          if [ "$code" != "200" ] || ! grep -q '"ordersEnabled":false' "$body"; then
            echo "MT5 Proxy health or read-only safety check failed (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$proxy/api/account?connection_id=00000000-0000-4000-8000-000000000000" || true)"
          if [ "$code" != "401" ] || ! grep -q '"authentication_required"' "$body"; then
            echo "MT5 Proxy did not reject unauthenticated private account access (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$mcp/health" || true)"
          if [ "$code" != "200" ] || ! grep -q '"liveTradingEnabled":false' "$body" || ! grep -q '"toolCount":13' "$body"; then
            echo "Remote MCP health or read-only tool contract failed (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":9,"method":"tools/list"}' "$mcp/mcp" || true)"
          if [ "$code" != "401" ] || ! grep -q '"unauthorized"' "$body"; then
            echo "Remote MCP did not reject an unauthenticated request (HTTP $code)."
            exit 1
          fi
          echo "Cloudflare relay, MT5 proxy, and Remote MCP safety smoke tests passed."
