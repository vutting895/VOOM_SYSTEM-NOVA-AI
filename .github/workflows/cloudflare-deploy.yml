name: Deploy NOVA Frontend to Cloudflare

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nova-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_ALPACA_WORKER_URL: ${{ secrets.NEXT_PUBLIC_ALPACA_WORKER_URL }}
    steps:
      - name: Checkout exact commit validated by Frontend CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify deployment configuration without printing secrets
        shell: bash
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_ALPACA_WORKER_URL; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Deployment blocked. Add these repository Actions secrets (values are never printed): %s\n' "${missing[*]}"
            exit 1
          fi
          echo "Required deployment configuration is present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Cloudflare OpenNext tooling
        working-directory: frontend
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare wrangler

      - name: Build and deploy the Next.js frontend to Cloudflare
        working-directory: frontend
        run: npm run cf:deploy
