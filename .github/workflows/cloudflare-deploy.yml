name: Deploy NOVA Frontend to Cloudflare

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nova-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAFlosj98ci8iYugG' }}
      NEXT_PUBLIC_MT5_READONLY_PROXY_URL: ${{ vars.NEXT_PUBLIC_MT5_READONLY_PROXY_URL }}
    steps:
      - name: Checkout exact commit validated by Frontend CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify required deployment configuration without printing values
        shell: bash
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_TURNSTILE_SITE_KEY; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Deployment blocked. Configure the listed GitHub Actions secrets/variables (values are never printed): ${missing[*]}"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_MT5_READONLY_PROXY_URL" ]; then
            echo "MT5 read-only proxy URL is not configured; broker UI will report connection unavailable."
          fi
          echo "Required deployment configuration is present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Cloudflare OpenNext tooling
        working-directory: frontend
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare wrangler

      - name: Build and deploy the Next.js frontend to Cloudflare
        working-directory: frontend
        run: npm run cf:deploy

      - name: Deploy authenticated Exness MT5 read-only proxy
        working-directory: frontend
        run: npx wrangler deploy --config ../integrations/mt5-readonly-proxy/wrangler.jsonc --keep-vars

      - name: Smoke-test deployed frontend and MT5 Proxy without credentials
        shell: bash
        run: |
          set -euo pipefail
          ui="https://voom-system-nova-ui.suwapat787.workers.dev"
          proxy="https://voom-mt5-readonly-proxy.suwapat787.workers.dev"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$ui/")"
          if [ "$code" != "200" ]; then
            echo "Frontend root did not return HTTP 200 (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$proxy/health")"
          if [ "$code" != "200" ] || ! grep -q '"ordersEnabled":false' "$body"; then
            echo "MT5 Proxy public health or read-only safety check failed (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$proxy/api/account?connection_id=00000000-0000-4000-8000-000000000000")"
          if [ "$code" != "401" ] || ! grep -q '"authentication_required"' "$body"; then
            echo "MT5 Proxy did not reject unauthenticated private account access (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$ui/api/broker/status?broker=mt5")"
          if [ "$code" != "401" ] || ! grep -q '"auth_required"' "$body"; then
            echo "Frontend broker API did not reject unauthenticated MT5 status access (HTTP $code)."
            exit 1
          fi
          echo "Frontend is live; MT5 proxy health is safe; unauthenticated private MT5 APIs are rejected."
