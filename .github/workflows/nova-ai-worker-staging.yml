name: Deploy NOVA AI Worker Staging

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: "Type DEPLOY_STAGING to confirm a non-production deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nova-ai-worker-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: startsWith(github.ref, 'refs/heads/fix/staging-supabase-auth-diagnostic-')
    runs-on: ubuntu-latest
    environment: nova-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require explicit staging confirmation
        shell: bash
        env:
          CONFIRM_STAGING: ${{ inputs.confirm_staging }}
        run: |
          if [ "$CONFIRM_STAGING" != "DEPLOY_STAGING" ]; then
            echo "Staging deployment blocked. Re-run manually and type DEPLOY_STAGING."
            exit 1
          fi

      - name: Verify staging-only Cloudflare configuration
        shell: bash
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Staging deployment blocked. Missing nova-staging environment secrets: ${missing[*]}"
            exit 1
          fi
          echo "Staging Cloudflare configuration is present."

      - name: Checkout selected staging branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install NOVA AI Worker dependencies
        run: npm ci --prefix integrations/nova-ai-worker

      - name: Run NOVA AI Worker security tests
        working-directory: integrations/nova-ai-worker
        run: npm test

      - name: Deploy only the isolated Staging Worker
        run: >-
          npx --yes wrangler@4.36.0 deploy
          --config integrations/nova-ai-worker/wrangler.toml
          --env staging
          --keep-vars

      - name: Verify Staging health and Auth diagnostic
        shell: bash
        run: |
          set -euo pipefail
          base="https://voom-system-nova-ai-staging.suwapat787.workers.dev"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$base/health")"
          if [ "$code" != "200" ] || ! jq -e '.executionEnabled == false and .liveTradingEnabled == false' "$body" >/dev/null; then
            echo "Staging health or read-only safety check failed (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$base/diagnostics/supabase-auth")"
          if [ "$code" != "200" ] || ! jq -e '.ok == true and .supabaseAuth.reachable == true and .executionEnabled == false and .liveTradingEnabled == false' "$body" >/dev/null; then
            echo "Staging Supabase Auth diagnostic or safety check failed (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' -X POST "$base/api/gen-ai/generate" -H 'Content-Type: application/json' --data '{"prompt":"unauthenticated staging security check"}')"
          if [ "$code" != "401" ] || ! jq -e '.error == "authentication_required"' "$body" >/dev/null; then
            echo "Staging Worker did not reject unauthenticated generation (HTTP $code)."
            exit 1
          fi

          echo "Staging health, Supabase Auth reachability, read-only safety and unauthenticated API rejection checks passed."
