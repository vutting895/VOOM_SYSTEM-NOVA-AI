name: Deploy NOVA AI Worker to isolated Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-ai-worker-staging
  cancel-in-progress: false

jobs:
  test-and-deploy-staging:
    runs-on: ubuntu-latest
    environment: nova-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Validate staging-only configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key:-}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Staging deployment blocked; configure secrets in GitHub Environment nova-staging: ${missing[*]}"
            exit 1
          fi
          echo "Cloudflare staging credentials are present. Supabase bindings will be preserved from the isolated staging Worker."

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run NOVA AI Worker regression tests
        working-directory: integrations/nova-ai-worker
        run: npm test

      - name: Deploy isolated Staging Worker
        working-directory: integrations/nova-ai-worker
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the existing Supabase Staging URL and publishable key already
          # bound to voom-system-nova-ai-staging. Do not inject Production values.
          npx --yes wrangler deploy --env staging --config wrangler.toml --keep-vars

      - name: Smoke-test Staging health and Auth diagnostic
        shell: bash
        run: |
          set -euo pipefail
          base="https://voom-system-nova-ai-staging.${CLOUDFLARE_ACCOUNT_SUBDOMAIN:-suwapat787}.workers.dev"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$base/health")"
          if [ "$code" != "200" ] || ! grep -q '"executionEnabled":false' "$body" || ! grep -q '"liveTradingEnabled":false' "$body"; then
            echo "Staging health/safety smoke test failed (HTTP $code)."
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$base/diagnostics/supabase-auth")"
          if [ "$code" != "200" ] || ! grep -q '"dependency":"supabase-auth"' "$body" || ! grep -q '"result":"ok"' "$body"; then
            echo "Staging Supabase Auth diagnostic failed (HTTP $code). Sanitized response follows:"
            cat "$body"
            exit 1
          fi

          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' -X POST "$base/api/gen-ai/generate" -H 'Content-Type: application/json' --data '{"prompt":"staging unauthenticated security test"}')"
          if [ "$code" != "401" ] || ! grep -q '"error":"authentication_required"' "$body"; then
            echo "Staging did not reject unauthenticated generation (HTTP $code)."
            exit 1
          fi
          echo "Staging health and Supabase Auth are reachable; unauthenticated generation is rejected; execution remains disabled."
