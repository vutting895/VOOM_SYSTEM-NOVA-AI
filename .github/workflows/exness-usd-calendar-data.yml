name: Exness USD Calendar Dataset Validation

on:
  pull_request:
    paths:
      - "datasets/exness-demo/news/**"
      - "tests/test_exness_usd_calendar_dataset.py"
      - ".github/workflows/exness-usd-calendar-data.yml"

permissions:
  contents: read

jobs:
  validate-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate historical MT5 calendar provenance and integrity
        run: python -m unittest discover -s tests -p "test_exness_usd_calendar_dataset.py" -v
