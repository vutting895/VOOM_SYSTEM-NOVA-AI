name: NOVA Model Validation (Linux)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-model-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  notebook-validation:
    name: Notebook JSON, Python AST, data and OOS gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook test dependency
        run: python -m pip install --disable-pip-version-check "pandas>=2.2,<3"
      - name: Validate notebook structure, AST, dataset gates and OOS boundaries
        run: python -m unittest discover -s tests -p "test_nova_notebook.py" -v

  bridge-readonly-validation:
    name: MT5 Bridge read-only and tenant isolation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Bridge Python sources without importing MT5
        run: python -m py_compile integrations/mt5-readonly-bridge/bridge.py integrations/mt5-readonly-bridge/bridge_relay_client.py
      - name: Validate tenant authentication and read-only contract
        run: python -m unittest discover -s integrations/mt5-readonly-bridge -p "test_tenant_guard.py" -v
