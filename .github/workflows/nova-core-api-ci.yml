name: NOVA Core API CI

on:
  pull_request:
    paths:
      - "integrations/nova-core-api/**"
      - ".github/workflows/nova-core-api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: integrations/nova-core-api
        run: npm install --package-lock-only && npm ci
      - name: Run unit tests
        working-directory: integrations/nova-core-api
        run: npm test
