name: Wave3 Challenger P2 CI

on:
  pull_request:
    branches: [main]
    paths:
      - "research/wave3_challenger/**"
      - "tests/test_wave3_challenger_first_hit_labels.py"
      - "docs/WAVE3_POSITIVE_EDGE_REDESIGN.md"
      - ".github/workflows/wave3-challenger-p2-ci.yml"
  push:
    branches:
      - "research/wave3-positive-edge-architecture-*"
    paths:
      - "research/wave3_challenger/**"
      - "tests/test_wave3_challenger_first_hit_labels.py"
      - "docs/WAVE3_POSITIVE_EDGE_REDESIGN.md"
      - ".github/workflows/wave3-challenger-p2-ci.yml"

permissions:
  contents: read

concurrency:
  group: wave3-challenger-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-hit-label-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated challenger P2 tests
        run: python -m unittest discover -s tests -p "test_wave3_challenger_first_hit_labels.py" -v
