name: Secret Custody Contract Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/implementation/NOVA-SECRET-CUSTODY-PLANE-ADR.md"
      - "tools/secret-custody-proof/**"
      - ".github/workflows/secret-custody-contract-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-custody-contract-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contract-proof:
    name: Synthetic-only custody API contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run synthetic custody contract tests
        run: node --test tools/secret-custody-proof/contract.test.mjs
