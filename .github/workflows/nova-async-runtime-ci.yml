name: NOVA Async Runtime CI

on:
  pull_request:
    paths:
      - "backend/async_runtime/**"
      - "infra/async-runtime/**"
      - "integrations/system-hub/**"
      - ".github/workflows/nova-async-runtime-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/async_runtime/**"
      - "infra/async-runtime/**"
      - ".github/workflows/nova-async-runtime-ci.yml"

permissions:
  contents: read

jobs:
  async-runtime-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_BROKER_URL: redis://127.0.0.1:6379/0
      REDIS_STATE_URL: redis://127.0.0.1:6379/1
      REDIS_RESULT_BACKEND_URL: redis://127.0.0.1:6379/2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/async_runtime/requirements.txt

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check -r backend/async_runtime/requirements.txt

      - name: Compile Python runtime
        working-directory: backend/async_runtime
        run: python -m compileall -q .

      - name: Run unit and Redis/Celery integration tests
        working-directory: backend/async_runtime
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate Docker Compose configuration
        run: docker compose -f infra/async-runtime/docker-compose.yml config --quiet
