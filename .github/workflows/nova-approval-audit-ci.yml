name: NOVA Approval Audit Database CI

on:
  pull_request:
    paths:
      - "supabase/migrations/202610300001_nova_durable_approval_lifecycle.sql"
      - "supabase/pending-migrations/202611070001_nova_approval_audit_event_log.sql"
      - "tests/sql/nova-approval-migration.integration.sql"
      - "tests/sql/nova-approval-audit-events.integration.sql"
      - "tests/nova-approval-migration.test.mjs"
      - "tests/nova-approval-audit-events.test.mjs"
      - ".github/workflows/nova-approval-audit-ci.yml"
  push:
    branches:
      - main
      - feat/nova-approval-audit-events-20261107
    paths:
      - "supabase/migrations/202610300001_nova_durable_approval_lifecycle.sql"
      - "supabase/pending-migrations/202611070001_nova_approval_audit_event_log.sql"
      - "tests/sql/nova-approval-migration.integration.sql"
      - "tests/sql/nova-approval-audit-events.integration.sql"
      - "tests/nova-approval-migration.test.mjs"
      - "tests/nova-approval-audit-events.test.mjs"
      - ".github/workflows/nova-approval-audit-ci.yml"

permissions:
  contents: read

jobs:
  postgres-approval-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nova-ci-only-password
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize disposable Supabase-compatible PostgreSQL roles
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          test -n "$pg_container"
          docker exec -i "$pg_container" psql -U postgres -d nova_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $function$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          SQL

      - name: Apply the existing approval lifecycle and pending audit candidate
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker cp supabase/migrations/202610300001_nova_durable_approval_lifecycle.sql "$pg_container:/tmp/nova-approval-base.sql"
          docker cp supabase/pending-migrations/202611070001_nova_approval_audit_event_log.sql "$pg_container:/tmp/nova-approval-audit.sql"
          docker exec "$pg_container" psql -U postgres -d nova_test -v ON_ERROR_STOP=1 -f /tmp/nova-approval-base.sql
          docker exec "$pg_container" psql -U postgres -d nova_test -v ON_ERROR_STOP=1 -f /tmp/nova-approval-audit.sql

      - name: Verify original approval lifecycle and new append-only audit history
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker cp tests/sql/nova-approval-migration.integration.sql "$pg_container:/tmp/nova-approval-lifecycle-test.sql"
          docker cp tests/sql/nova-approval-audit-events.integration.sql "$pg_container:/tmp/nova-approval-audit-test.sql"
          docker exec "$pg_container" psql -X -U postgres -d nova_test -v ON_ERROR_STOP=1 -f /tmp/nova-approval-lifecycle-test.sql
          docker exec "$pg_container" psql -X -U postgres -d nova_test -v ON_ERROR_STOP=1 -f /tmp/nova-approval-audit-test.sql

      - name: Run approval database contract tests
        run: node --test tests/nova-approval-migration.test.mjs tests/nova-approval-audit-events.test.mjs
