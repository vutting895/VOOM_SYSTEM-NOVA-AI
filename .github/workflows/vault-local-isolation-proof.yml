name: Vault Local Isolation Proof

on:
  pull_request:
    branches:
      - main
      - security/vault-readiness-consolidated-20261031
    paths:
      - "tools/vault-proof/**"
      - ".github/workflows/vault-local-isolation-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-local-isolation-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-vault-proof:
    name: Disposable Supabase Vault privilege and owner-isolation proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "2.120.0"

      - name: Verify local-only project contract
        working-directory: tools/vault-proof
        run: node --test contract.test.mjs

      - name: Start disposable local Supabase stack
        working-directory: tools/vault-proof
        run: supabase start

      - name: Recreate the disposable database from local proof migrations
        working-directory: tools/vault-proof
        run: supabase db reset --local --yes

      - name: Run PostgreSQL Vault privilege and tenant-isolation tests
        working-directory: tools/vault-proof
        run: supabase test db --local

      - name: Stop disposable local Supabase stack
        if: always()
        working-directory: tools/vault-proof
        run: supabase stop --no-backup || true
