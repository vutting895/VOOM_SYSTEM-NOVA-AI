name: Verify NOVA Hugging Face configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-huggingface:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface_hub>=0.30,<2"

      - name: Verify token and destination repositories without exposing credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: ${{ vars.HF_SPACE_REPO_ID }}
          HF_MODEL_REPO_ID: ${{ vars.HF_MODEL_REPO_ID }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "").strip()
          space_id = os.environ.get("HF_SPACE_REPO_ID", "").strip()
          model_id = os.environ.get("HF_MODEL_REPO_ID", "").strip()

          missing = [
              name for name, value in (
                  ("Actions secret HF_TOKEN", token),
                  ("Actions variable HF_SPACE_REPO_ID", space_id),
                  ("Actions variable HF_MODEL_REPO_ID", model_id),
              ) if not value
          ]
          if missing:
              raise SystemExit("Missing GitHub configuration: " + ", ".join(missing))

          api = HfApi(token=token)
          for repo_id, repo_type in ((space_id, "space"), (model_id, "model")):
              info = api.repo_info(repo_id=repo_id, repo_type=repo_type)
              if not info.private:
                  raise SystemExit(
                      f"{repo_type} repository {repo_id} must be private for NOVA artifacts."
                  )
              print(f"Verified private {repo_type} repository: {repo_id}")
          print("Hugging Face credentials and private destinations are reachable.")
          PY
