name: Wave3 Cloud Scheduler Contract

on:
  pull_request:
    paths:
      - "integrations/wave3-cloud-scheduler/**"
      - ".github/workflows/wave3-cloud-scheduler-ci.yml"
  push:
    branches: [main]
    paths:
      - "integrations/wave3-cloud-scheduler/**"
      - ".github/workflows/wave3-cloud-scheduler-ci.yml"

permissions:
  contents: read

jobs:
  scheduler-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/wave3-cloud-scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Cloudflare Free scheduler contract
        run: npm test
