name: NOVA Core API

on:
  pull_request:
    paths:
      - "integrations/nova-core-api/**"
      - ".github/workflows/nova-core-api.yml"
  push:
    branches:
      - main
      - "feature/nova-core-api-readonly-v1"
    paths:
      - "integrations/nova-core-api/**"
      - ".github/workflows/nova-core-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/nova-core-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
