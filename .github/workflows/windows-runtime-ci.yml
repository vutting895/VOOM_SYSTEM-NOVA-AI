name: Windows Runtime CI

on:
  pull_request:
    paths:
      - "tools/windows/**"
      - "integrations/mt5-readonly-bridge/**"
      - ".github/workflows/windows-runtime-ci.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "tools/windows/**"
      - "integrations/mt5-readonly-bridge/**"
      - ".github/workflows/windows-runtime-ci.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  powershell-parse:
    name: Validate Windows bootstrap and Bridge safety contract
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell bootstrap without running it
        shell: pwsh
        run: |
          $path = (Resolve-Path "tools/windows/run-bridge-from-git.ps1").Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell parser reported $($errors.Count) error(s)."
          }
          Write-Host "PowerShell bootstrap syntax is valid."

      - name: Assert bootstrap validates the expected repository without pipeline exit-code ambiguity
        shell: pwsh
        run: |
          $bootstrap = Get-Content -Raw "tools/windows/run-bridge-from-git.ps1"
          if ($bootstrap -notmatch 'config --local --get remote\.origin\.url') {
            throw "Bootstrap must inspect the local configured origin directly."
          }
          if ($bootstrap -match 'remote get-url origin\s*\|\s*Select-Object') {
            throw "Bootstrap must not pipe remote URL lookup through Select-Object."
          }
          foreach ($guard in @(
            '\$RemoteUri\.Scheme',
            '\$RemoteUri\.Host',
            '\$RemoteUri\.IsDefaultPort',
            '\$RemoteUri\.UserInfo',
            '\$RemotePath'
          )) {
            if ($bootstrap -notmatch $guard) {
              throw "Expected strict origin validation guard is missing: $guard"
            }
          }
          Write-Host "Bootstrap repository identity guard checks passed."

      - name: Assert relay secret helper prefers installed Wrangler and bounds waits
        shell: pwsh
        run: |
          $provisioner = Get-Content -Raw "tools/windows/provision-mt5-relay-route.ps1"
          if ($provisioner -notmatch 'Get-Command wrangler\.cmd') {
            throw "Route helper must detect the installed Wrangler command."
          }
          if ($provisioner -notmatch "'wrangler'") {
            throw "Route helper must prefer the installed Wrangler CLI."
          }
          if ($provisioner -notmatch 'npx wrangler') {
            throw "Route helper must retain an npx fallback when Wrangler is not installed globally."
          }
          if ($provisioner -notmatch 'WaitForExit\(90000\)') {
            throw "Route helper must bound the CLI wait."
          }
          if ($provisioner -notmatch 'ReadToEndAsync\(\)') {
            throw "Route helper must drain both process output streams without printing secrets."
          }
          Write-Host "Relay secret helper safety checks passed."
          if ($provisioner -notmatch "voom-mt5-bridge-relay") {
            throw "Route helper must provision the relay Worker."
          }
          if ($provisioner -notmatch "voom-mt5-readonly-proxy") {
            throw "Route helper must provision the authenticated proxy Worker."
          }
          if (-not $provisioner.Contains("workerNames = @('voom-mt5-bridge-relay', 'voom-mt5-readonly-proxy')")) {
            throw "Route helper must explicitly enumerate both intended Workers."
          }
          if ($provisioner -notmatch 'ConfirmSingleTenantRoute') {
            throw "Both Worker secret updates must retain the single-tenant replacement guard."
          }
          Write-Host "Both Worker route-map provisioning checks passed."

      - name: Set up Python for Profit-First policy contract tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Profit-First Flatten decision contract
        shell: pwsh
        run: |
          python -m unittest discover -s integrations/mt5-readonly-bridge -p "test_profit_first_flatten_contract.py" -v

      - name: Assert Bridge stays read-only
        shell: pwsh
        run: |
          $bridge = Get-Content -Raw "integrations/mt5-readonly-bridge/bridge.py"
          if ($bridge -notmatch 'allow_methods=\["GET", "OPTIONS"\]') {
            throw "Bridge CORS method allowlist is not GET/OPTIONS-only."
          }
          if ($bridge -match 'mt5\.order_send\s*\(') {
            throw "Order submission implementation found in the read-only Bridge."
          }
          if ($bridge -notmatch 'order_submission_enabled": False') {
            throw "Bridge read-only safety flag is missing."
          }
          Write-Host "Read-only safety contract checks passed."
