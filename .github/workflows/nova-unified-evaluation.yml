name: NOVA Unified Evaluation Contracts

on:
  pull_request:
    paths:
      - "docs/NOVA_UNIFIED_INTELLIGENCE.md"
      - "workers/quant_engine/unified_evaluation.py"
      - "tests/test_quant_unified_evaluation.py"
      - "notebooks/NOVA_Unified_Intelligence_Research.ipynb"
      - ".github/workflows/nova-unified-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate unified evaluation and notebook contracts
        run: python -m unittest discover -s tests -p 'test_quant_unified_evaluation.py' -v
