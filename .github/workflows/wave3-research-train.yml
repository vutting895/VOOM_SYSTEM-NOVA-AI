name: Wave3 research model training

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-wave3.txt
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
      - name: Install research dependencies
        run: python -m pip install -r requirements-wave3.txt
      - name: Verify pinned historical USD high-impact calendar bytes
        run: >-
          python tools/verify_wave3_news_calendar.py
          datasets/exness-demo/news/VOOM_USD_High_Impact_2022_2026.csv
      - name: Validate historical USD high-impact calendar
        run: >-
          python tools/validate_wave3_news_calendar.py
          datasets/exness-demo/news/VOOM_USD_High_Impact_2022_2026.csv
      - name: Train models and run walk-forward / final OOS backtest
        run: >-
          python tools/train_wave3_models.py
          --news-calendar datasets/exness-demo/news/VOOM_USD_High_Impact_2022_2026.csv
          --model-dir models/wave3_news_calendar_20261030
          --report reports/wave3_news_calendar_20261030_report.json
      - name: Upload model artifacts and research report
        uses: actions/upload-artifact@v4
        with:
          name: wave3-xgb-lstm-research-${{ github.sha }}
          path: |
            models/wave3_news_calendar_20261030/
            reports/wave3_news_calendar_20261030_report.json
            reports/wave3_auto_tuning_history.json
            reports/wave3_final_oos_trades.csv
          if-no-files-found: error
          retention-days: 30
