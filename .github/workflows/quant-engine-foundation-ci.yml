name: Quant Engine Foundation CI

on:
  pull_request:
    paths:
      - "workers/quant_engine/**"
      - "tests/test_quant_engine.py"
      - "tests/test_quant_experiment_contract.py"
      - "docs/INTERNAL-QUANT-ENGINE-ARCHITECTURE.md"
      - "ci/quant_engine/**"
      - "ci/quant-engine-worker/**"
      - "docs/ci/CLOUDFLARE-QUANT-ENGINE-PILOT.md"
      - ".github/workflows/quant-engine-foundation-ci.yml"

permissions:
  contents: read

jobs:
  quant-foundation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Quant Engine package and focused tests
        run: python -m compileall -q workers/quant_engine tests/test_quant_engine.py tests/test_quant_experiment_contract.py
      - name: Run Quant Engine contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_quant*.py" -v
      - name: Run Cloudflare pilot runner on the same commit
        run: python ci/quant_engine/run.py
      - name: Upload pilot CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-quant-engine-ci-report
          path: artifacts/quant-engine-ci-report.json
          if-no-files-found: warn
          retention-days: 7
