name: Quant Engine Foundation CI

on:
  pull_request:
    paths:
      - "workers/quant_engine/**"
      - "tests/test_vision_mae.py"
      - "docs/NOVA-CAUSAL-CHART-VISION-MAE.md"
      - "workers/feature/supervised_xgboost_prototype.py"
      - "tests/test_quant_engine.py"
      - "tests/test_quant_experiment_contract.py"
      - "tests/test_quant_meta_decision.py"
      - "tests/test_model_plugin_contract.py"
      - "tests/test_sequence_data.py"
      - "tests/test_training_contract.py"
      - "tests/test_xgboost_data.py"
      - "docs/INTERNAL-QUANT-ENGINE-ARCHITECTURE.md"
      - ".github/workflows/quant-engine-foundation-ci.yml"

permissions:
  contents: read

jobs:
  quant-foundation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Quant Engine package and focused tests
        run: python -m compileall -q workers/quant_engine tests/test_quant_engine.py tests/test_quant_experiment_contract.py tests/test_quant_meta_decision.py tests/test_model_plugin_contract.py tests/test_sequence_data.py tests/test_training_contract.py tests/test_xgboost_data.py
      - name: Run Quant Engine contract tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p "test_quant*.py" -v
          python -m unittest discover -s tests -p "test_model_plugin_contract.py" -v
          python -m unittest discover -s tests -p "test_sequence_data.py" -v
          python -m unittest discover -s tests -p "test_training_contract.py" -v
          python -m unittest discover -s tests -p "test_xgboost_data.py" -v
          python -m unittest discover -s tests -p "test_vision_mae.py" -v
