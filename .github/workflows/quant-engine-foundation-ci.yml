name: Quant Engine Foundation CI

on:
  pull_request:
    paths:
      - "workers/quant_engine/**"
      - "tests/test_quant_engine.py"
      - "tests/test_quant_experiment_contract.py"
      - "tests/test_mtraders_native_hybrid.py"
      - "integrations/mt5/MTRADERS_All_In_One_v1.01.mq5"
      - "docs/INTERNAL-QUANT-ENGINE-ARCHITECTURE.md"
      - "docs/NOVA-MTRADERS-HYBRID-STRATEGY.md"
      - ".github/workflows/quant-engine-foundation-ci.yml"

permissions:
  contents: read

jobs:
  quant-foundation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Quant Engine package and focused tests
        run: python -m compileall -q workers/quant_engine tests/test_quant_engine.py tests/test_quant_experiment_contract.py tests/test_mtraders_native_hybrid.py
      - name: Run Quant Engine contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_quant*.py" -v
      - name: Run MTRADERS Native and Hybrid strategy tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_mtraders*.py" -v
