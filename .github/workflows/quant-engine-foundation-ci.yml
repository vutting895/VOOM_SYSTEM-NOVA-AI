name: Quant Engine Foundation CI

on:
  pull_request:
    paths:
      - "workers/quant_engine/**"
      - "workers/quantlab_api.py"
      - "workers/quant_engine/dataset_artifact.py"
      - "workers/quant_engine/dataset_executor.py"
      - "tests/test_quantlab_dispatcher.py"
      - "workers/runtime.py"
      - "integrations/system-hub/**"
      - "tests/test_quant_engine.py"
      - "tests/test_quant_experiment_contract.py"
      - "tests/test_quantlab_api.py"
      - "tests/test_quantlab_dataset_executor.py"
      - "docs/INTERNAL-QUANT-ENGINE-ARCHITECTURE.md"
      - ".github/workflows/quant-engine-foundation-ci.yml"

permissions:
  contents: read

jobs:
  quant-foundation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js for System Hub contract tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run authenticated System Hub API and tenant boundary tests
        run: node --test integrations/system-hub/tests/*.test.mjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API runtime and test dependencies
        run: python -m pip install -r workers/requirements.txt
      - name: Compile Quant Engine package and focused tests
        run: python -m compileall -q workers/quant_engine workers/quantlab_api.py workers/runtime.py tests/test_quant_engine.py tests/test_quant_experiment_contract.py tests/test_quantlab_api.py tests/test_quantlab_dataset_executor.py tests/test_quantlab_dispatcher.py
      - name: Run Quant Engine contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_quant_engine.py" -v
      - name: Run QuantLab authenticated API and queue tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_quantlab_api.py tests/test_quantlab_dataset_executor.py tests/test_quantlab_dispatcher.py -q
