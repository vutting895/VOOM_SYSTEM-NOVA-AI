name: Secret Custody Local Proof

on:
  pull_request:
    paths:
      - "tools/secret-custody-proof/**"
      - ".github/workflows/secret-custody-proof.yml"
  push:
    branches: [main]
    paths:
      - "tools/secret-custody-proof/**"
      - ".github/workflows/secret-custody-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-synthetic-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Secret Custody schema, runtime, crypto and adapter proofs
        run: node --test tools/secret-custody-proof/*.test.mjs
      - name: Syntax-check Secret Custody proof modules
        run: |
          for file in tools/secret-custody-proof/*.mjs; do
            node --check "$file"
          done
