name: Trading Safety Guard CI

on:
  pull_request:
    paths:
      - "server.ts"
      - "trading-safety.mjs"
      - "src/components/SystemSettingsView.tsx"
      - "src/components/LiveTradingTerminalView.tsx"
      - "tests/trading-safety-contract.test.mjs"
      - ".github/workflows/trading-safety-ci.yml"

permissions:
  contents: read

jobs:
  trading-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify fail-closed trading safety contracts
        run: node --test tests/trading-safety-contract.test.mjs
