name: NOVA AI Worker CI

on:
  pull_request:
    paths:
      - "integrations/nova-ai-worker/**"
      - ".github/workflows/ai-worker-ci.yml"
  push:
    branches: [main]
    paths:
      - "integrations/nova-ai-worker/**"
      - ".github/workflows/ai-worker-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test authenticated NOVA Agent and Worker security contract
        working-directory: integrations/nova-ai-worker
        run: node --test
