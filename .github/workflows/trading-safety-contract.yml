name: Trading Safety Contract CI

on:
  pull_request:
    paths:
      - ".env.example"
      - "server.ts"
      - "src/components/SystemSettingsView.tsx"
      - "backend/**"
      - "tests/trading-fail-closed.test.mjs"
      - ".github/workflows/trading-safety-contract.yml"

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify trading stays disabled
        run: node --test tests/trading-fail-closed.test.mjs
