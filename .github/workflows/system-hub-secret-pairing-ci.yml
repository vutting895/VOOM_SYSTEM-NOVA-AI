name: System Hub Secret Pairing CI

on:
  pull_request:
    paths:
      - "integrations/system-hub/**"
      - "supabase/migrations/202611030001_nova_secret_qr_pairing.sql"
      - "tests/sql/nova-secret-pairing-migration.integration.sql"
      - "docs/architecture/NOVA-SECURE-QR-GATEWAY.md"
      - ".github/workflows/system-hub-secret-pairing-ci.yml"

permissions:
  contents: read

jobs:
  pairing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run System Hub tests
        working-directory: integrations/system-hub
        run: npm test
      - name: Verify pairing migration contract
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/202611030001_nova_secret_qr_pairing.sql"
          grep -q "ENABLE ROW LEVEL SECURITY" "$migration"
          grep -q "secret_pairing_select_own" "$migration"
          grep -q "secret_pairing_update_own" "$migration"
          grep -q "nova_secret_pairing_guard_update" "$migration"
          grep -q "token_hash" "$migration"
          ! grep -Eiq "(api[_-]?key|password|access[_-]?token)[[:space:]]+text" "$migration"
  postgres-rls-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nova-ci-only-password
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize isolated Supabase Auth stubs
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)" psql -U postgres -d nova_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid LANGUAGE sql STABLE
          AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $function$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL
      - name: Apply pairing migration
        run: |
          set -euo pipefail
          docker exec -i "$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)" psql -U postgres -d nova_test -v ON_ERROR_STOP=1 < supabase/migrations/202611030001_nova_secret_qr_pairing.sql
      - name: Verify owner isolation and one-time state transitions
        run: |
          set -euo pipefail
          docker exec -i "$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)" psql -X -U postgres -d nova_test -v ON_ERROR_STOP=1 < tests/sql/nova-secret-pairing-migration.integration.sql
