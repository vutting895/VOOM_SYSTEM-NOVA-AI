name: NOVA Learning Engine Validation (Linux)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-learning-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  learning-engine:
    name: Learning Engine compile and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/learning/requirements-training.txt
      - name: Install test and training-module dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pytest "SQLAlchemy>=2.0,<3" "fastapi>=0.100" "pydantic>=2"
          python -m pip install --disable-pip-version-check -r backend/learning/requirements-training.txt
      - name: Compile Learning Engine and Kaggle entrypoint
        run: |
          python -m compileall -q backend/learning
          python -m py_compile kaggle/nova-auto-learning/main.py
      - name: Run Learning Engine, approval gate, OOS and Kaggle manifest tests
        run: python -m pytest backend/learning/tests -q
