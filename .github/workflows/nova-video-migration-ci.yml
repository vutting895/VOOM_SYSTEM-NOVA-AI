name: NOVA Video Migration CI

on:
  pull_request:
    paths:
      - "supabase/pending-migrations/nova_video_workspace.sql"
      - "tests/sql/nova-video-migration.integration.sql"
      - ".github/workflows/nova-video-migration-ci.yml"
  push:
    branches: [main]
    paths:
      - "supabase/pending-migrations/nova_video_workspace.sql"
      - "tests/sql/nova-video-migration.integration.sql"
      - ".github/workflows/nova-video-migration-ci.yml"

permissions:
  contents: read

jobs:
  postgres-migration-and-tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nova-video-ci-only-password
          POSTGRES_DB: nova_video_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nova_video_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize isolated PostgreSQL roles and Supabase Auth stub
        shell: bash
        env:
          PGPASSWORD: nova-video-ci-only-password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d nova_video_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $function$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          GRANT USAGE ON SCHEMA public TO authenticated, anon;
          SQL

      - name: Apply the NOVA Video migration
        shell: bash
        env:
          PGPASSWORD: nova-video-ci-only-password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d nova_video_test -v ON_ERROR_STOP=1 \
            -f supabase/pending-migrations/nova_video_workspace.sql

      - name: Verify owner access, cross-tenant denial and zero-cost database constraints
        shell: bash
        env:
          PGPASSWORD: nova-video-ci-only-password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d nova_video_test -X -v ON_ERROR_STOP=1 \
            -f tests/sql/nova-video-migration.integration.sql
