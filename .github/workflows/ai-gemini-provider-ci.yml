name: NOVA Gemini Provider CI

on:
  pull_request:
    paths:
      - "integrations/nova-ai-worker/**"
      - ".github/workflows/ai-gemini-provider-ci.yml"
      - ".circleci/config.yml"
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run NOVA AI Worker and Gemini provider tests
        working-directory: integrations/nova-ai-worker
        run: node --test
      - name: Install Wrangler for configuration validation
        run: npm install --no-save --package-lock=false wrangler@4.156.0
      - name: Validate Worker configuration without deploying
        run: npx wrangler deploy --dry-run --config integrations/nova-ai-worker/wrangler.toml
