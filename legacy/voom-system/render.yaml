services:
  - type: web
    name: voom-system-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRADING_MODE
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: VOOM_BRIDGE_SHARED_SECRET
        sync: false
