<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>VOOM Admin Login</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#e8eef8;background:#0b1220;--line:#27364b;--muted:#9aabc2;--accent:#62d6b0;--red:#ff8585}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(ellipse at top right,#152b3a 0,transparent 45%),#0b1220;padding:18px}.card{width:min(100%,420px);padding:28px;border:1px solid var(--line);border-radius:18px;background:#121f32;box-shadow:0 20px 70px #0004}h1{font-size:25px;margin:8px 0}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:800}.muted{color:var(--muted);font-size:13px;line-height:1.5}label{display:block;margin:18px 0 7px;font-size:13px}input{width:100%;padding:12px;border:1px solid #34445c;border-radius:9px;background:#0a1422;color:#fff;font-size:15px}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:var(--accent);color:#092219;font-weight:800;font-size:14px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#message{min-height:22px;color:var(--red);margin-top:12px;font-size:13px}.tag{display:inline-block;margin-top:15px;border:1px solid var(--line);border-radius:20px;padding:5px 9px;color:var(--accent);font-size:11px}
</style></head><body><main class="card"><div class="eyebrow">VOOM_SYSTEM · PRIVATE ACCESS</div><h1>Admin Security Dashboard</h1><p class="muted">Sign in with the administrator account configured on this Windows host. This dashboard is restricted to local access.</p><form id="loginForm"><label for="username">Admin username</label><input id="username" name="username" autocomplete="username" required maxlength="80"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit" type="submit">Sign in securely</button><div id="message" role="status" aria-live="polite"></div></form><span class="tag">127.0.0.1 · Admin only</span></main><script src="/login.js" defer></script></body></html>
