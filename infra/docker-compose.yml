services:
  mcp-server:
    image: voom-system-mcp-ci
    build:
      context: ..
      dockerfile: mcp-server/Dockerfile
    container_name: voom-system-nova-mcp
    stdin_open: true
    tty: true
    restart: "no"
    environment:
      VOOM_PROJECT_NAME: voom_system
      VOOM_ARCHITECTURE: nova
    # MCP stdio is intentionally not published as a network port.
  frontend:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ../frontend:/workspace
      - nova_frontend_node_modules:/workspace/node_modules
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
      MT5_BRIDGE_HEALTH_URL: ${MT5_BRIDGE_HEALTH_URL:-}
      MT5_BRIDGE_TOKEN: ${MT5_BRIDGE_TOKEN:-}
volumes:
  nova_frontend_node_modules:
