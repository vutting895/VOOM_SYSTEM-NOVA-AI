name = "voom-system-nova-ai"
main = "worker.js"
compatibility_date = "2026-10-27"
workers_dev = true

[ai]
binding = "AI"

[observability]
enabled = true

# Isolated non-production deployment. Uses only GitHub Environment secrets
# scoped to "nova-staging"; never inherit or reference production credentials.
[env.staging]
name = "voom-system-nova-ai-staging"
workers_dev = true

[env.staging.ai]
binding = "AI"

[env.staging.observability]
enabled = true
\n# Per-location approximate guard for the public Supabase Auth diagnostic.\n[[ratelimits]]\nname = "DIAGNOSTIC_RATE_LIMITER"\nnamespace_id = "43920261127"\n\n[ratelimits.simple]\nlimit = 30\nperiod = 60\n\n# Staging environments do not inherit top-level bindings.\n[[env.staging.ratelimits]]\nname = "DIAGNOSTIC_RATE_LIMITER"\nnamespace_id = "43920261128"\n\n[env.staging.ratelimits.simple]\nlimit = 30\nperiod = 60\n