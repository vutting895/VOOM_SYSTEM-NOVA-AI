name = "voom-system-nova-ai"
main = "worker.js"
compatibility_date = "2026-10-27"
workers_dev = true

[ai]
binding = "AI"

[observability]
enabled = true

# Isolated non-production deployment. Uses only GitHub Environment secrets
# scoped to "nova-staging"; never inherit or reference production credentials.
[env.staging]
name = "voom-system-nova-ai-staging"
workers_dev = true

[env.staging.ai]
binding = "AI"

[env.staging.observability]
enabled = true

# Per-location approximate guard for the public Supabase Auth diagnostic.
[[ratelimits]]
name = "DIAGNOSTIC_RATE_LIMITER"
namespace_id = "43920261127"

[ratelimits.simple]
limit = 30
period = 60

# Staging environments do not inherit top-level bindings.
[[env.staging.ratelimits]]
name = "DIAGNOSTIC_RATE_LIMITER"
namespace_id = "43920261128"

[env.staging.ratelimits.simple]
limit = 30
period = 60
