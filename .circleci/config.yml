version: 2.1

jobs:
  test-nova-ai-worker:
    docker:
      - image: cimg/node:22.0
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Run NOVA AI Worker regression tests
          command: cd integrations/nova-ai-worker && npm test

workflows:
  validate-nova-ai-worker:
    jobs:
      - test-nova-ai-worker
