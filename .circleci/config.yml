version: 2.1

jobs:
  test-nova-ai-worker:
    docker:
      - image: cimg/node:22
    working_directory: ~/project
    steps:
      - run:
          name: Checkout public repository over HTTPS
          command: |
            set -euo pipefail
            git init .
            git remote add origin https://github.com/vutting895/VOOM_SYSTEM-NOVA-AI.git
            git fetch --depth=1 origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - run:
          name: Verify CircleCI checkout and Node runtime
          command: |
            set -euo pipefail
            echo "Workspace: $(pwd)"
            node --version
            npm --version
            test -f integrations/nova-ai-worker/package.json
            test -f integrations/nova-ai-worker/worker.js
            test -f integrations/nova-ai-worker/worker.test.mjs
      - run:
          name: Inspect Node JUnit reporter output
          command: |
            set -euo pipefail
            mkdir -p test-reports/diagnostic
            node --test --test-reporter=junit --test-reporter-destination=test-reports/diagnostic/junit.xml integrations/nova-ai-worker/intent-contract.test.mjs integrations/nova-ai-worker/worker.test.mjs
            test -s test-reports/diagnostic/junit.xml
            sed -n '1,12p' test-reports/diagnostic/junit.xml
      - run:
          name: Validate NOVA Smarter Testing configuration
          command: circleci testsuite doctor "ci tests"
      - run:
          name: Run NOVA AI Worker regression tests
          command: |
            set -euo pipefail
            cd integrations/nova-ai-worker
            npm test

workflows:
  validate-nova-ai-worker:
    jobs:
      - test-nova-ai-worker
