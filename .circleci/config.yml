version: 2.1

# Dynamic setup: run only the validation pipeline for changed NOVA app files.
setup: true

orbs:
  path-filtering: circleci/path-filtering@2

workflows:
  detect-changes:
    jobs:
      - path-filtering/filter:
          name: detect-nova-command-center-changes
          base-revision: main
          config-path: .circleci/continue_config.yml
          mapping: |
            ^apps/nova-command-center/.* run_nova_command_center true
            ^\\.circleci/.* run_nova_command_center true
