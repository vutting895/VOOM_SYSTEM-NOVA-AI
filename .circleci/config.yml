version: 2.1

jobs:
  nova-core-api-test:
    docker:
      - image: cimg/node:22.12
    working_directory: ~/project
    steps:
      # Public repository: avoid the default SSH/blobless checkout path.
      - run:
          name: Checkout exact source over HTTPS
          command: |
            set -euo pipefail
            : "${CIRCLE_SHA1:?CircleCI did not provide CIRCLE_SHA1}"
            git clone --no-checkout https://github.com/vutting895/VOOM_SYSTEM-NOVA-AI.git .
            git checkout --detach "${CIRCLE_SHA1}"
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1}"
      - run:
          name: Install NOVA Core API dependencies
          command: cd integrations/nova-core-api && npm install --no-audit --no-fund
      - run:
          name: Run NOVA Core API unit tests
          command: cd integrations/nova-core-api && npm test

workflows:
  nova-core-api:
    jobs:
      - nova-core-api-test
