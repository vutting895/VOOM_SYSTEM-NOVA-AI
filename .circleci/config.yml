version: 2.1

jobs:
  test-nova-ai-worker:
    docker:
      - image: cimg/node:22
    working_directory: ~/project
    steps:
      - run:
          name: Checkout public repository over HTTPS
          command: |
            set -euo pipefail
            git init .
            git remote add origin https://github.com/vutting895/VOOM_SYSTEM-NOVA-AI.git
            git fetch --depth=1 origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - run:
          name: Verify CircleCI checkout and Node runtime
          command: |
            set -euo pipefail
            echo "Workspace: $(pwd)"
            node --version
            npm --version
            test -f integrations/nova-ai-worker/package.json
            test -f integrations/nova-ai-worker/worker.js
            test -f integrations/nova-ai-worker/worker.test.mjs
      - run:
          name: Install NOVA AI Worker test dependencies
          command: npm ci --prefix integrations/nova-ai-worker
      - run:
          name: Run NOVA AI Worker tests with Smarter Testing
          command: circleci testsuite run "ci tests"

workflows:
  validate-nova-ai-worker:
    jobs:
      - test-nova-ai-worker
