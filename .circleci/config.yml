version: 2.1

jobs:
  nova-readonly-validation:
    docker:
      - image: cimg/node:22.14.0
    resource_class: small
    environment:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-not-a-secret"
      NEXT_PUBLIC_SYSTEM_HUB_URL: "https://example.invalid"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAFlosj98ci8iYugG"
    steps:
      - checkout
      - run:
          name: Install Python test runtime
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3 python3-pip
      - run:
          name: Install root Vite dependencies without writing a lockfile
          command: npm install --no-package-lock --include=dev
      - run:
          name: Test NOVA Demo-only read-only execution guard
          command: node --test tests/nova-trading-readonly-guard.test.mjs
      - run:
          name: Test NOVA training status honesty
          command: node --test tests/nova-training-status-honesty.test.mjs
      - run:
          name: Test Supabase Marketplace security migration contract
          command: node --test tests/supabase-marketplace-security-migration.test.mjs
      - run:
          name: Test Supabase Vault readiness and local secret boundaries
          command: node --test tests/secret-vault-readiness.test.mjs
      - run:
          name: Test NOVA durable approval lifecycle contracts
          command: node --test tests/nova-approval-migration.test.mjs
      - run:
          name: Syntax-check staging customer isolation harness
          command: node --check tests/staging-customer-isolation.mjs
      - run:
          name: Test NOVA AI Worker authentication and safety contract
          command: node --test integrations/nova-ai-worker/*.test.mjs
      - run:
          name: Test NOVA System Integration Hub authorization and tenant boundaries
          command: node --test integrations/system-hub/tests/*.test.mjs
      - run:
          name: Test Remote MCP Exness MT5 read-only tools
          command: node --test integrations/remote-mcp-worker/tests/*.test.mjs
      - run:
          name: Test tenant-isolated MT5 Bridge relay and proxy
          command: node --test integrations/mt5-bridge-relay/worker.test.mjs integrations/mt5-readonly-proxy/worker.test.mjs
      - run:
          name: Compile MT5 bridge Python sources without connecting to a terminal
          command: python3 -m py_compile integrations/mt5-readonly-bridge/bridge.py integrations/mt5-readonly-bridge/bridge_relay_client.py
      - run:
          name: Test MT5 tenant guard contract
          command: python3 -m unittest discover -s integrations/mt5-readonly-bridge -p "test_*.py"
      - run:
          name: Install Wrangler for configuration validation only
          command: npm install --no-save --package-lock=false wrangler@4.156.0
      - run:
          name: Validate MT5 Bridge Relay Durable Object configuration
          command: npx wrangler deploy --dry-run --config integrations/mt5-bridge-relay/wrangler.jsonc
      - run:
          name: Validate NOVA System Integration Hub Worker bundle
          command: npx wrangler deploy --dry-run --config integrations/system-hub/wrangler.jsonc
      - run:
          name: Build NOVA Vite frontend
          command: npm run build

workflows:
  nova-readonly-validation:
    jobs:
      - nova-readonly-validation
