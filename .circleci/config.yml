version: 2.1

jobs:
  currency-normalization-tests:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Compile currency normalization core and tests
          command: python -m py_compile workers/risk/currency_normalization.py tests/test_currency_normalization.py
      - run:
          name: Run deterministic currency normalization tests
          command: python -m unittest discover -s tests -p "test_currency_normalization.py" -v

workflows:
  verify:
    jobs:
      - currency-normalization-tests
