version: 2.1

jobs:
  nova-core-api-test:
    docker:
      - image: cimg/node:22.12
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install NOVA Core API dependencies
          command: cd integrations/nova-core-api && npm install --no-audit --no-fund
      - run:
          name: Run NOVA Core API unit tests
          command: cd integrations/nova-core-api && npm test

workflows:
  nova-core-api:
    jobs:
      - nova-core-api-test
