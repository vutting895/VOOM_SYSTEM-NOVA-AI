version: 2.1

parameters:
  operation:
    type: enum
    enum: ["validate", "mark-release", "rollback-request"]
    default: "validate"
  review_evidence_url:
    type: string
    default: ""
  rollback_target_sha:
    type: string
    default: ""
  rollback_evidence:
    type: string
    default: ""
  rollback_reason:
    type: string
    default: "Operator-requested rollback"

# NOVA-only, pull-request CI. This configuration intentionally contains no
# deployment jobs, credentials, contexts, project environment variables,
# broker integrations, or production endpoints.
#
# Configure the CircleCI GitHub App trigger to run on PR opened / updated
# events. The workflow-level condition is a second gate: only pull_request events
# and deliberate manual API runs execute these jobs. Push and schedule events
# do not execute these jobs.

jobs:
  nova-frontend-contract:
    docker:
      - image: cimg/node:22.13.0
    environment:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-not-a-secret"
      NEXT_PUBLIC_SYSTEM_HUB_URL: "https://example.invalid"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAFlosj98ci8iYugG"
    steps:
      - checkout
      - run:
          name: Verify exact CircleCI checkout SHA
          command: |
            set -euo pipefail
            actual_sha="$(git rev-parse HEAD)"
            test "$actual_sha" = "$CIRCLE_SHA1"
            echo "Verified checkout SHA: $actual_sha"
      - run:
          name: Install frontend dependencies without changing lockfiles
          command: npm install --no-package-lock --include=dev
      - run:
          name: Run NOVA v1.83 EA source and concurrency safety fixtures when present
          command: |
            set -euo pipefail
            if [ -f tests/nova-ea-v183-source-integrity.test.mjs ] && [ -f tests/nova-ea-v183-concurrency-runtime-fixtures.test.mjs ]; then
              node --test tests/nova-ea-v183-source-integrity.test.mjs tests/nova-ea-v183-concurrency-runtime-fixtures.test.mjs
            else
              echo "SKIP: EA v1.83 research candidate tests are not part of this revision."
            fi
      - run:
          name: Run NOVA read-only and security contract tests
          command: |
            set -euo pipefail
            node --test tests/nova-trading-readonly-guard.test.mjs
            node --test tests/supabase-marketplace-security-migration.test.mjs
            node --test tests/secret-vault-readiness.test.mjs
            node --test tests/nova-approval-migration.test.mjs
            node --check tests/staging-customer-isolation.mjs
            node --test integrations/nova-ai-worker/*.test.mjs
            node --test integrations/system-hub/tests/*.test.mjs
            node --test integrations/remote-mcp-worker/tests/*.test.mjs
            node --test integrations/mt5-bridge-relay/worker.test.mjs integrations/mt5-readonly-proxy/worker.test.mjs
      - run:
          name: Install Wrangler for configuration validation without changing lockfiles
          command: npm install --no-save --package-lock=false wrangler@4.156.0
      - run:
          name: Validate NOVA tenant relay and System Hub Worker configurations
          command: |
            set -euo pipefail
            npx wrangler deploy --dry-run --config integrations/mt5-bridge-relay/wrangler.jsonc
            npx wrangler deploy --dry-run --config integrations/system-hub/wrangler.jsonc
      - run:
          name: Build NOVA frontend
          command: npm run build

  nova-smc-python:
    docker:
      - image: cimg/python:3.11.9
    steps:
      - checkout
      - run:
          name: Verify exact CircleCI checkout SHA
          command: |
            set -euo pipefail
            actual_sha="$(git rev-parse HEAD)"
            test "$actual_sha" = "$CIRCLE_SHA1"
            echo "Verified checkout SHA: $actual_sha"
      - run:
          name: Install SMC test dependencies
          command: python -m pip install --disable-pip-version-check -r workers/requirements.txt
      - run:
          name: Compile and test SMC research module
          command: |
            set -euo pipefail
            python -m py_compile workers/feature/smc_wave/smc_strategy.py
            python -m unittest discover -s tests -p "test_smc_strategy.py" -v
            python -m pytest tests/test_smc_pytest.py tests/test_telegram_alerts.py tests/test_runtime_api.py tests/test_research_pipeline.py -q

  nova-mt5-bridge-python:
    docker:
      - image: cimg/python:3.11.9
    steps:
      - checkout
      - run:
          name: Verify exact CircleCI checkout SHA
          command: |
            set -euo pipefail
            actual_sha="$(git rev-parse HEAD)"
            test "$actual_sha" = "$CIRCLE_SHA1"
            echo "Verified checkout SHA: $actual_sha"
      - run:
          name: Compile and test MT5 read-only bridge
          command: |
            set -euo pipefail
            python -m py_compile integrations/mt5-readonly-bridge/bridge.py integrations/mt5-readonly-bridge/bridge_relay_client.py
            python -m unittest discover -s integrations/mt5-readonly-bridge -p "test_*.py" -v

  nova-smc-worker:
    docker:
      - image: cimg/node:22.13.0
    steps:
      - checkout
      - run:
          name: Verify exact CircleCI checkout SHA
          command: |
            set -euo pipefail
            actual_sha="$(git rev-parse HEAD)"
            test "$actual_sha" = "$CIRCLE_SHA1"
            echo "Verified checkout SHA: $actual_sha"
      - run:
          name: Test NOVA SMC Worker classification
          command: node --test integrations/remote-mcp-worker/tests/smc.test.mjs

  nova-quant-contract:
    docker:
      - image: cimg/python:3.11.9
    steps:
      - checkout
      - run:
          name: Verify exact CircleCI checkout SHA
          command: |
            set -euo pipefail
            actual_sha="$(git rev-parse HEAD)"
            test "$actual_sha" = "$CIRCLE_SHA1"
            echo "Verified checkout SHA: $actual_sha"
      - run:
          name: Compile and test Quant Engine contracts
          command: |
            set -euo pipefail
            python -m compileall -q workers/quant_engine tests/test_quant_engine.py tests/test_quant_experiment_contract.py
            PYTHONPATH=. python -m unittest discover -s tests -p "test_quant*.py" -v

  nova-notebook-validation-python:
    docker:
      - image: cimg/python:3.11.9
    steps:
      - checkout
      - run:
          name: Verify exact CircleCI checkout SHA
          command: |
            set -euo pipefail
            actual_sha="$(git rev-parse HEAD)"
            test "$actual_sha" = "$CIRCLE_SHA1"
            echo "Verified checkout SHA: $actual_sha"
      - run:
          name: Install notebook validation dependency
          command: python -m pip install --disable-pip-version-check "pandas>=2.2,<3"
      - run:
          name: Validate Notebook JSON, AST, Bridge safety and data-gap tests when present
          command: |
            set -euo pipefail
            if [ -f tests/test_nova_notebook.py ]; then
              python -m unittest discover -s tests -p "test_nova_notebook.py" -v
            else
              echo "SKIP: notebook validation module is not part of this commit."
            fi

  release-candidate-validation:
    docker:
      - image: cimg/python:3.11.9
    steps:
      - checkout
      - run:
          name: Verify exact release candidate SHA and GitHub Actions ownership
          command: |
            set -euo pipefail
            actual_sha="$(git rev-parse HEAD)"
            test "$actual_sha" = "$CIRCLE_SHA1"
            git fetch origin main --quiet
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Candidate is stale or diverged from current main; refusing release validation."
              exit 1
            fi
            test -f .github/workflows/cloudflare-deploy.yml
            grep -q 'workflow_run:' .github/workflows/cloudflare-deploy.yml
            grep -q "head_branch == 'main'" .github/workflows/cloudflare-deploy.yml
            grep -q 'wrangler deploy' .github/workflows/cloudflare-deploy.yml
            grep -q 'NOVA_APPROVALS_ENABLED: "false"' .github/workflows/cloudflare-deploy.yml
            echo "Exact candidate SHA verified; GitHub Actions remains the production deploy owner."
      - run:
          name: Test release marker and rollback evidence contracts
          command: python -m unittest discover -s tests -p "test_release_control.py" -v

  create-release-marker:
    docker:
      - image: cimg/python:3.11.9
    steps:
      - checkout
      - run:
          name: Create immutable SHA-bound release candidate marker
          environment:
            REVIEW_EVIDENCE_URL: "<< pipeline.parameters.review_evidence_url >>"
          command: |
            set -euo pipefail
            test -n "$REVIEW_EVIDENCE_URL"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            python scripts/release_control.py create-marker \
              --repository "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              --sha "$CIRCLE_SHA1" \
              --review-evidence "$REVIEW_EVIDENCE_URL" \
              --approval-build-url "https://app.circleci.com/pipelines/github/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/$CIRCLE_PIPELINE_NUMBER" \
              --workflow-id "$CIRCLE_WORKFLOW_ID" \
              --build-number "$CIRCLE_BUILD_NUM"
      - store_artifacts:
          path: release-evidence
          destination: immutable-release-candidate-marker

  rollback-preflight:
    docker:
      - image: cimg/python:3.11.9
    steps:
      - checkout
      - run:
          name: Validate rollback target and create a non-executing handoff request
          environment:
            TARGET_SHA: "<< pipeline.parameters.rollback_target_sha >>"
            EVIDENCE_URL: "<< pipeline.parameters.rollback_evidence >>"
            ROLLBACK_REASON: "<< pipeline.parameters.rollback_reason >>"
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            git fetch origin main --quiet
            python scripts/release_control.py rollback-request \
              --repository "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              --target-sha "$TARGET_SHA" \
              --evidence "$EVIDENCE_URL" \
              --reason "$ROLLBACK_REASON"
      - persist_to_workspace:
          root: .
          paths:
            - rollback-evidence/rollback-request.json

  publish-rollback-request:
    docker:
      - image: cimg/python:3.11.9
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Confirm rollback handoff remains non-executing
          command: |
            set -euo pipefail
            python - <<'PY'
            import json, os
            from pathlib import Path
            payload = json.loads(Path("rollback-evidence/rollback-request.json").read_text())
            assert payload["execution_owner"] == "GitHub Actions"
            assert payload["execution_status"] == "NOT_EXECUTED"
            assert payload["circleci_deploy_or_rollback_executed"] is False
            assert payload["request_status"] == "PENDING_GITHUB_ACTIONS_OPERATOR_VERIFICATION"
            payload["circleci_approval"] = {
                "status": "approval_gate_completed",
                "pipeline_url": f"https://app.circleci.com/pipelines/github/{os.environ['CIRCLE_PROJECT_USERNAME']}/{os.environ['CIRCLE_PROJECT_REPONAME']}/{os.environ['CIRCLE_PIPELINE_NUMBER']}",
                "workflow_id": os.environ.get("CIRCLE_WORKFLOW_ID", ""),
                "approver_identity": None,
                "approver_timestamp_utc": None,
            }
            Path("rollback-evidence/approved-rollback-request.json").write_text(
                json.dumps(payload, indent=2, sort_keys=True) + "\\n"
            )
            print("Rollback handoff validated; no deployment or rollback was executed.")
            PY
      - store_artifacts:
          path: rollback-evidence
          destination: github-actions-rollback-handoff


workflows:
  nova-pull-request-ci:
    when: pipeline.event.name == "pull_request" and (pipeline.event.action == "opened" or pipeline.event.action == "synchronize" or pipeline.event.action == "reopened")
    jobs:
      - nova-frontend-contract
      - nova-smc-python
      - nova-smc-worker
      - nova-mt5-bridge-python
      - nova-quant-contract
      - nova-notebook-validation-python

  nova-manual-release-validation:
    when: pipeline.event.name == "api" and pipeline.parameters.operation == "validate"
    jobs:
      - nova-frontend-contract
      - nova-smc-python
      - nova-smc-worker
      - nova-mt5-bridge-python
      - nova-quant-contract
      - nova-notebook-validation-python
      - release-candidate-validation:
          requires:
            - nova-frontend-contract
            - nova-smc-python
            - nova-smc-worker
            - nova-mt5-bridge-python
            - nova-quant-contract
            - nova-notebook-validation-python

  nova-create-release-marker:
    when: pipeline.event.name == "api" and pipeline.parameters.operation == "mark-release"
    jobs:
      - nova-frontend-contract
      - nova-smc-python
      - nova-smc-worker
      - nova-mt5-bridge-python
      - nova-quant-contract
      - nova-notebook-validation-python
      - release-candidate-validation:
          requires:
            - nova-frontend-contract
            - nova-smc-python
            - nova-smc-worker
            - nova-mt5-bridge-python
            - nova-quant-contract
            - nova-notebook-validation-python
      - approve-release-candidate:
          type: approval
          requires:
            - release-candidate-validation
      - create-release-marker:
          requires:
            - approve-release-candidate

  nova-rollback-request:
    when: pipeline.event.name == "api" and pipeline.parameters.operation == "rollback-request"
    jobs:
      - rollback-preflight
      - approve-rollback-handoff:
          type: approval
          requires:
            - rollback-preflight
      - publish-rollback-request:
          requires:
            - approve-rollback-handoff
