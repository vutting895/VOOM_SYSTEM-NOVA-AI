version: 2.1

parameters:
  run_nova_command_center:
    type: boolean
    default: false

jobs:
  nova-command-center-check:
    docker:
      - image: oven/bun:1
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Resolve app-local lockfile
          command: cd apps/nova-command-center && bun install --lockfile-only
      - run:
          name: Install dependencies
          command: cd apps/nova-command-center && bun install --frozen-lockfile
      - run:
          name: TypeScript, lint, unit tests and production build
          command: cd apps/nova-command-center && bun run check:ci

workflows:
  nova-command-center:
    when: << pipeline.parameters.run_nova_command_center >>
    jobs:
      - nova-command-center-check
