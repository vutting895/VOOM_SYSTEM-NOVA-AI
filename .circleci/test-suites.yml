---
name: ci tests
discover: find integrations/nova-ai-worker -maxdepth 1 -type f -name '*.test.mjs' -print
run: |
  set -euo pipefail
  mkdir -p "<< outputs.junit-directory >>"
  for test_file in << test.atoms >>; do
    report="<< outputs.junit-directory >>/$(basename "$test_file" .mjs).xml"
    node --test --test-reporter=./integrations/nova-ai-worker/node_modules/node-test-junit-reporter/index.js --test-reporter-destination="$report" "$test_file"
    sed -i "s|<testcase |<testcase file=\"$test_file\" classname=\"node:test\" |g" "$report"
  done
outputs:
  junit-directory: test-reports/junit
options:
  store-test-results: true
