openapi: 3.1.0
info:
  title: NOVA System Hub API
  version: 1.0.0
  description: >
    Contract snapshot for the existing NOVA System Hub control-plane routes.
    This file documents source-level behavior; it is not evidence that a deployed
    endpoint is reachable. Protected operations require a verified Supabase access token.
security:
  - SupabaseBearer: []
paths:
  /health:
    get:
      security: []
      summary: Minimal public service health
      responses:
        '200':
          description: Health and non-sensitive readiness flags
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, status, mode, ordersEnabled, executionEnabled, liveTradingEnabled]
                properties:
                  ok: { type: boolean }
                  service: { const: voom-system-hub }
                  status: { type: string }
                  mode: { const: control-plane-read-only }
                  authConfigured: { type: boolean }
                  mt5ProxyConfigured: { type: boolean }
                  ordersEnabled: { const: false }
                  executionEnabled: { const: false }
                  liveTradingEnabled: { const: false }
  /v1/integrations:
    get:
      summary: List integration capabilities for the authenticated user
      responses:
        '200':
          description: Integration registry snapshot
          content:
            application/json:
              schema:
                type: object
                required: [service, integrations, mode, ordersEnabled, liveTradingEnabled]
                properties:
                  service: { const: voom-system-hub }
                  integrations:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  mode: { const: read-only }
                  ordersEnabled: { const: false }
                  liveTradingEnabled: { const: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/connections:
    get:
      summary: List only the authenticated user's broker connection records
      responses:
        '200':
          description: Owner-scoped connection metadata
          content:
            application/json:
              schema:
                type: object
                required: [connections, count, ordersEnabled, liveTradingEnabled]
                properties:
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/Connection' }
                  count: { type: integer, minimum: 0 }
                  ordersEnabled: { const: false }
                  liveTradingEnabled: { const: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      summary: Request an Exness MT5 Demo connection record
      description: >
        Creates or reuses a pending Demo connection for the authenticated user.
        This does not provision a bridge, authenticate a broker terminal, or enable trading.
      responses:
        '200':
          description: Existing owner-scoped Demo connection reused
        '201':
          description: Pending Demo connection record created
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/connections/{connectionId}/status:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      summary: Read owner-scoped connection record status
      responses:
        '200':
          description: Connection metadata; not proof of broker data verification
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Connection'
                  - type: object
                    properties:
                      state: { type: string }
                      dataVerified: { const: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { description: Invalid connection UUID }
        '403': { description: Integration is not allowed for this connection }\n        '404': { description: No connection record exists for the authenticated user }\n        '409': { description: Connection or bridge is not ready }\n        '502': { description: Read-only broker adapter or bridge unavailable }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/connections/{connectionId}/check:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    post:
      summary: Check the read-only Demo connection path
      description: Checks readiness only; it does not submit or modify orders.
      responses:
        '200':\n          description: Read-only account path verified; no account payload is returned\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/VerificationResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Connection is not owned by the authenticated user }
        '404': { description: Connection not found }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/connections/{connectionId}/account:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      summary: Read account summary through the tenant-isolated read-only adapter
      responses:
        '200':\n          description: Read-only account summary\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/AccountResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Connection is not owned by the authenticated user }
        '404': { description: Connection not found }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/connections/{connectionId}/quotes:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      summary: Read market quotes through the tenant-isolated read-only adapter
      responses:
        '200':\n          description: Read-only quote data\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/QuotesResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Connection is not owned by the authenticated user }
        '404': { description: Connection not found }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Supabase access token
  parameters:
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing, invalid or expired Supabase access token
    Unavailable:
      description: Authentication provider, tenant store or downstream adapter unavailable
  schemas:
    VerificationResult:\n      type: object\n      required: [connectionId, state, dataVerified, ordersEnabled, liveTradingEnabled]\n      properties:\n        connectionId: { type: string, format: uuid }\n        state: { type: string }\n        dataVerified: { type: boolean }\n        accountReadSucceeded: { type: boolean }\n        checkedAt: { type: string, format: date-time }\n        ordersEnabled: { const: false }\n        liveTradingEnabled: { const: false }\n    AccountResult:\n      type: object\n      required: [connectionId, state, dataVerified, account, ordersEnabled, liveTradingEnabled]\n      properties:\n        connectionId: { type: string, format: uuid }\n        state: { const: data_verified }\n        dataVerified: { const: true }\n        checkedAt: { type: string, format: date-time }\n        account:\n          type: object\n          required: [connected, broker, platform, environment, mode, order_submission_enabled]\n          properties:\n            connected: { const: true }\n            broker: { const: Exness }\n            platform: { const: MT5 }\n            environment: { const: demo }\n            server: { type: [string, 'null'] }\n            currency: { type: [string, 'null'] }\n            balance: { type: [number, 'null'] }\n            equity: { type: [number, 'null'] }\n            margin: { type: [number, 'null'] }\n            free_margin: { type: [number, 'null'] }\n            margin_level: { type: [number, 'null'] }\n            mode: { const: read-only }\n            order_submission_enabled: { const: false }\n            as_of: { type: [string, 'null'], format: date-time }\n        ordersEnabled: { const: false }\n        liveTradingEnabled: { const: false }\n    QuotesResult:\n      type: object\n      required: [connectionId, state, dataVerified, quote, ordersEnabled, liveTradingEnabled]\n      properties:\n        connectionId: { type: string, format: uuid }\n        state: { const: data_verified }\n        dataVerified: { const: true }\n        quote:\n          type: object\n          required: [symbol, timeframe, tick, bars, count, mode, order_submission_enabled]\n          properties:\n            symbol: { type: string }\n            timeframe: { type: string }\n            digits: { type: [number, 'null'] }\n            tick: { type: [object, 'null'] }\n            bars: { type: array, items: { type: object } }\n            count: { type: integer, minimum: 0 }\n            mode: { const: read-only }\n            order_submission_enabled: { const: false }\n            as_of: { type: [string, 'null'], format: date-time }\n        ordersEnabled: { const: false }\n        liveTradingEnabled: { const: false }\n    Connection:
      type: object
      required: [connectionId, provider, environment, recordStatus, readiness, dataVerified, capabilities, ordersEnabled, liveTradingEnabled]
      properties:
        connectionId: { type: string, format: uuid }
        provider: { const: exness_mt5 }
        environment: { const: demo }
        recordStatus: { type: string }
        accountLabel: { type: [string, 'null'] }
        lastVerifiedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: [string, 'null'], format: date-time }
        bridgeAllocated: { type: boolean }
        readiness: { type: string }
        dataVerified: { const: false }
        capabilities:
          type: object
          required: [accountRead, marketDataRead, orderSubmission]
          properties:
            accountRead: { type: boolean }
            marketDataRead: { type: boolean }
            orderSubmission: { const: false }
        ordersEnabled: { const: false }
        liveTradingEnabled: { const: false }
