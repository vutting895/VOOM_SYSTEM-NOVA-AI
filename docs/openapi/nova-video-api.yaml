openapi: 3.1.0
info:
  title: NOVA AI Video API
  version: 0.1.0
  description: >
    Tenant-scoped, bearer-authenticated API for video project metadata and job requests.
    This release records requests only. It does not upload media, invoke models, dispatch
    workers, generate videos, analyze clips, edit, or export media.
# The Worker origin is withheld until a reviewed deployment SHA and staging acceptance are verified.
servers: []
security:
  - SupabaseBearer: []
paths:
  /api/video/skills:
    options:
      security: []
      responses:
        '204': { description: CORS preflight accepted for an allowlisted Origin }
        '403': { description: Origin is not allowlisted }
    get:
      summary: Get the authenticated NOVA Video skill registry
      description: Read-only 22-skill catalog. Every skill is non-executable and reports zero estimated cost.
      responses:
        '200':
          description: Versioned skill registry and free-only execution policy
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, registryVersion, product, deliveryModel, policy, statusVocabulary, skillCount, skillGroups]
                properties:
                  schemaVersion: { type: string }
                  registryVersion: { type: string }
                  product: { const: NOVA AI Video Platform }
                  deliveryModel: { const: api_only }
                  skillCount: { type: integer, const: 22 }
                  policy:
                    type: object
                    required: [costMode, executionEnabled, paidApiAllowed, paidGpuAllowed]
                    properties:
                      costMode: { const: free_only }
                      executionEnabled: { const: false }
                      paidApiAllowed: { const: false }
                      paidGpuAllowed: { const: false }
                  skillGroups:
                    type: array
                    items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Supabase Auth unavailable or not configured }
  /api/video/plan:
    options:
      security: []
      responses:
        '204': { description: CORS preflight accepted for an allowlisted Origin }
        '403': { description: Origin is not allowlisted }
    post:
      summary: Create a deterministic NOVA Director production plan
      description: >
        Authenticated CPU-only planning. Does not invoke an LLM, video model, GPU,
        database, worker or media storage. Execution is disabled and human approval is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, concept]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                concept: { type: string, minLength: 1, maxLength: 1200 }
                audience: { type: string, maxLength: 240 }
                platform: { type: string, maxLength: 120 }
                language: { type: string, maxLength: 32 }
                style: { type: string, maxLength: 240 }
                callToAction: { type: string, maxLength: 240 }
                durationSeconds: { type: number, minimum: 3, maximum: 60, default: 15 }
                aspectRatio: { type: string, enum: ["9:16", "16:9", "1:1"] }
                goal: { type: string, enum: [product_ad, explainer, story, brand_film] }
                verifiedFacts: { type: array, maxItems: 12, items: { type: string, maxLength: 240 } }
                mustAvoid: { type: array, maxItems: 20, items: { type: string, maxLength: 160 } }
      responses:
        '200':
          description: Frame-accurate Director plan; no media execution occurs
          content:
            application/json:
              schema:
                type: object
                required: [directorPlan, executionEnabled, estimatedCost, requiresHumanApproval]
                properties:
                  directorPlan: { type: object }
                  executionEnabled: { const: false }
                  estimatedCost: { const: 0 }
                  requiresHumanApproval: { const: true }
                  explanation: { type: string }
        '400': { description: Invalid creative brief }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/video/production-plan:
    options:
      security: []
      responses:
        '204': { description: CORS preflight accepted for an allowlisted Origin }
        '403': { description: Origin is not allowlisted }
    post:
      summary: Project a NOVA Director timeline into Engine task contracts
      description: >
        Authenticated CPU-only planning. Creates per-scene generation task contracts and
        approval, assembly, quality-control and delivery dependencies. Every generation task
        remains blocked without verified zero-cost GPU capacity. No model, GPU, worker,
        database or media storage is invoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, concept]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                concept: { type: string, minLength: 1, maxLength: 1200 }
                audience: { type: string, maxLength: 240 }
                platform: { type: string, maxLength: 120 }
                language: { type: string, maxLength: 32 }
                style: { type: string, maxLength: 240 }
                callToAction: { type: string, maxLength: 240 }
                durationSeconds: { type: number, minimum: 3, maximum: 60, default: 15 }
                aspectRatio: { type: string, enum: ["9:16", "16:9", "1:1"] }
                goal: { type: string, enum: [product_ad, explainer, story, brand_film] }
                verifiedFacts: { type: array, maxItems: 12, items: { type: string, maxLength: 240 } }
                mustAvoid: { type: array, maxItems: 20, items: { type: string, maxLength: 160 } }
      responses:
        '200':
          description: Non-executable Engine production plan
          content:
            application/json:
              schema:
                type: object
                required: [productionPlan, executionEnabled, estimatedCost, requiresHumanApproval]
                properties:
                  productionPlan: { type: object }
                  executionEnabled: { const: false }
                  estimatedCost: { const: 0 }
                  requiresHumanApproval: { const: true }
                  explanation: { type: string }
        '400': { description: Invalid creative brief or Director timeline }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/video/projects:
    options:
      security: []
      responses:
        '204': { description: CORS preflight accepted for an allowlisted Origin }
        '403': { description: Origin is not allowlisted }
    get:
      summary: List the authenticated user's projects
      responses:
        '200':
          description: Owner-scoped projects
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Auth provider or project store unavailable }
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 2000, default: '' }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project: { $ref: '#/components/schemas/Project' }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Project store unavailable }
  /api/video/jobs:
    options:
      security: []
      responses:
        '204': { description: CORS preflight accepted for an allowlisted Origin }
        '403': { description: Origin is not allowlisted }
    get:
      summary: List the authenticated user's most recent jobs
      parameters:
        - in: query
          name: project_id
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owner-scoped job metadata
          content:
            application/json:
              schema:
                type: object
                required: [jobs, executionEnabled, estimatedCost]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
                  executionEnabled: { const: false }
                  estimatedCost: { const: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Job store unavailable }
    post:
      summary: Record a video job request without executing it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_id, task_type, prompt, idempotency_key]
              properties:
                project_id: { type: string, format: uuid }
                task_type:
                  type: string
                  enum: [video_generation, video_analysis, video_edit_export]
                prompt: { type: string, maxLength: 4000 }
                idempotency_key: { type: string, pattern: '^[A-Za-z0-9_-]{12,100}
      responses:
        '202':
          description: Request recorded but blocked; no worker is dispatched
          content:
            application/json:
              schema:
                type: object
                required: [job, executionEnabled]
                properties:
                  job: { $ref: '#/components/schemas/Job' }
                  executionEnabled: { const: false }
                  explanation: { type: string }
        '200':
          description: Idempotent replay of an identical request
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Idempotency key reused with a different payload }
        '503': { description: Job store unavailable }
components:
  securitySchemes:
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Supabase access token
  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token
  schemas:
    Project:
      type: object
      required: [id, title, description, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Job:
      type: object
      required: [id, project_id, task_type, status, prompt, request, execution_mode, estimated_cost, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        task_type: { type: string, enum: [video_generation, video_analysis, video_edit_export] }
        status: { type: string, enum: [blocked_no_free_gpu, blocked_worker_unavailable] }
        prompt: { type: string }
        request: { type: object, description: Optional server-generated NOVA Director plan under director_plan }
        execution_mode: { const: free_only }
        estimated_cost: { const: 0 }
        created_at: { type: string, format: date-time }
