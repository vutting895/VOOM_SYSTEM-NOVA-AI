[build]
  base = "."
  command = "python3 -m unittest discover -s tests -p \"test_smc_mean_rejection.py\" -v && node --test tests/nova-frontend-intelligence.test.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
