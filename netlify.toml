[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Explicitly disable legacy framework plugins injected by Netlify UI.
# This repository builds the root Vite app, not Next.js or Hugo.
[[plugins]]
  package = "@netlify/plugin-nextjs"
  [plugins.inputs]
    enabled = false

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    enabled = false
