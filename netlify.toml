[build]
  base = "."
  command = "npm install --no-package-lock --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# BrowserRouter deep links (including /connect) must resolve to the Vite SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
