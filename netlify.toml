[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Explicit API rewrites must precede the SPA fallback.
[[redirects]]
  from = "/api/price"
  to = "/.netlify/functions/price"
  status = 200

[[redirects]]
  from = "/api/portfolio"
  to = "/.netlify/functions/portfolio"
  status = 200

[[redirects]]
  from = "/api/history"
  to = "/.netlify/functions/history"
  status = 200

[[redirects]]
  from = "/api/trade"
  to = "/.netlify/functions/trade"
  status = 200

[[redirects]]
  from = "/api/market/overview"
  to = "/.netlify/functions/market-overview"
  status = 200

[[redirects]]
  from = "/api/market/candlesticks"
  to = "/.netlify/functions/market-candlesticks"
  status = 200

[[redirects]]
  from = "/api/broker/status"
  to = "/.netlify/functions/broker-status"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
